<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden & Registrieren - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css?v=2030">
    <!-- header-v2.css KALDIRILDI - Sadece V3 aktif -->
    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal.css">
    <link rel="stylesheet" href="toast.css">
    
    <script src="api-config.js"></script>

    <style>
        /* --- 1. GLOBAL & BACKGROUND (Galaxy Gradient) --- */
        :root {
            --primary-green: #2D5016;
            --primary-orange: #FF8C42;
            --text-gray: #666;
            --text-dark: #333;
            --bg-white: rgba(255, 255, 255, 0.95);
        }

        body {
            min-height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            /* Galaxy Gradient: Orange to Green mesh style */
            background: linear-gradient(135deg, var(--primary-green) 0%, #1a300d 40%, #c4621b 70%, var(--primary-orange) 100%);
            background-size: 200% 200%;
            animation: galaxyMove 15s ease infinite;
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        @keyframes galaxyMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Container to center the card but allow header/footer */
        .auth-page-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            margin-top: 80px; /* Header payi */
        }

        /* --- 2. THE SMART CARD --- */
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-white);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            padding: 40px;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 800;
        }

        /* --- 3. THE SWITCHER (Segmented Control) --- */
        .auth-toggle-wrapper {
            background: #f0f2f5;
            border-radius: 12px;
            padding: 4px;
            display: flex;
            margin-bottom: 30px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-gray);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2;
        }

        /* Active State logic */
        .toggle-btn.active {
            background-color: var(--primary-green);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(45, 80, 22, 0.25);
        }

        .toggle-btn:not(.active):hover {
            color: var(--primary-green);
            background-color: rgba(45, 80, 22, 0.05);
        }

        /* --- 4. FORM FIELDS --- */
        .form-section {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .form-section.active {
            display: block;
            opacity: 1;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-dark);
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e4e8;
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.2s ease;
            background: #fff;
            box-sizing: border-box;
        }

        .input-group input:focus {
            border-color: var(--primary-orange);
            outline: none;
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
        }

        /* --- 5. BUTTONS --- */
        .main-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            /* Orange Gradient Default */
            background: linear-gradient(135deg, #FF8C42 0%, #E8854C 100%);
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .main-btn:hover {
            /* Hover turns Green */
            background: linear-gradient(135deg, #2D5016 0%, #3d6b1e 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(45, 80, 22, 0.25);
        }

        /* Helper Text */
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
            color: var(--text-gray);
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        .auth-footer a {
            color: var(--primary-orange);
            text-decoration: none;
            font-weight: 600;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="auth-page-container">
        <div class="auth-card">
            <div class="auth-logo">
                <span style="color: var(--primary-green);">CSS</span>
                <span style="color: var(--primary-orange);">Berlin</span>
            </div>

            <div class="auth-toggle-wrapper">
                <button class="toggle-btn active" id="tab-login" onclick="switchTab('login')">Anmelden</button>
                <button class="toggle-btn" id="tab-register" onclick="switchTab('register')">Registrieren</button>
            </div>

            <form id="auth-gate-login-form" class="form-section active">
                <div class="input-group">
                    <label for="login-email">E-Mail Adresse</label>
                    <input type="email" id="login-email" name="email" placeholder="name@beispiel.de" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Passwort</label>
                    <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="main-btn auth-btn-login-submit">
                    <span>Jetzt Anmelden</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                        <polyline points="10 17 15 12 10 7"></polyline>
                        <line x1="15" y1="12" x2="3" y2="12"></line>
                    </svg>
                </button>

                <div class="auth-footer">
                    <a href="forgot-password.html">Passwort vergessen?</a>
                </div>
            </form>

            <form id="auth-gate-register-form" class="form-section">
                <div class="input-group">
                    <label for="reg-name">Vollständiger Name</label>
                    <input type="text" id="reg-name" name="first_name" placeholder="Max Mustermann" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">E-Mail Adresse</label>
                    <input type="email" id="reg-email" name="email" placeholder="name@beispiel.de" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Passwort erstellen</label>
                    <input type="password" id="reg-password" name="password" placeholder="••••••••" required>
                </div>
                <div class="input-group">
                    <label for="reg-confirm-password">Passwort bestätigen</label>
                    <input type="password" id="reg-confirm-password" name="confirm_password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="main-btn auth-btn-register-submit">
                    <span>Kostenlos Registrieren</span>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="8.5" cy="7" r="4"></circle>
                        <line x1="20" y1="8" x2="20" y2="14"></line>
                        <line x1="23" y1="11" x2="17" y2="11"></line>
                    </svg>
                </button>
                
                <div class="auth-footer">
                    Bereits ein Konto? <a href="#" onclick="switchTab('login'); return false;">Hier anmelden</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            const loginTab = document.getElementById('tab-login');
            const registerTab = document.getElementById('tab-register');
            const loginForm = document.getElementById('auth-gate-login-form');
            const registerForm = document.getElementById('auth-gate-register-form');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.classList.add('active');
                loginForm.classList.remove('active');
            }
        }
    </script>

    <script src="auth.js"></script>
    <script src="toast.js"></script>

</body>
</html>
