    <style>
        :root {
            --brand-dark-green: #2D5016;
            --brand-green-light: #3d6b1e;
            --brand-orange: #FF8C42;
            --brand-orange-hover: #e07b3a;
            --text-dark: #111827;
            --bg-light: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        .products {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            min-height: 400px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        @media (max-width: 1200px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Smart Filter Bar Styles */
        .smart-filter-container {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 12px 24px;
            display: none;
            overflow-x: auto;
            white-space: nowrap;
            -webkit-overflow-scrolling: touch;
            position: sticky;
            top: 0px;
            z-index: 900;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .smart-filter-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .filter-chip {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            background-color: #f3f4f6;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            text-decoration: none;
        }

        .filter-chip:hover {
            background-color: #e5e7eb;
            border-color: #d1d5db;
            transform: translateY(-1px);
        }

        .filter-chip.active {
            background-color: var(--brand-dark-green);
            color: white;
            border-color: var(--brand-dark-green);
            box-shadow: 0 2px 4px rgba(45, 80, 22, 0.3);
        }

        .filter-chip svg {
            width: 16px;
            height: 16px;
            margin-right: 6px;
        }

        .clear-filters-btn {
            margin-left: auto;
            font-size: 13px;
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            text-decoration: underline;
            display: none;
            font-weight: 500;
        }

        .smart-filter-container::-webkit-scrollbar {
            height: 0px;
            background: transparent;
        }

        .nav-link-v3.active-cat {
            color: var(--brand-orange) !important;
            border-bottom: 2px solid var(--brand-orange);
        }

        /* Kullanıcı Giriş Yaptığında Görünen Profil Alanı */
        #user-button-container {
            margin-left: 10px;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const categoryData = {
                'damen': [{ id: 'kleidung', name: 'Kleidung', icon: 'shirt' }, { id: 'schuhe', name: 'Schuhe', icon: 'footprints' }, { id: 'taschen', name: 'Taschen', icon: 'shopping-bag' }],
                'herren': [{ id: 'kleidung', name: 'Kleidung', icon: 'shirt' }, { id: 'schuhe', name: 'Schuhe', icon: 'footprints' }],
                'kinder': [{ id: 'maedchen', name: 'Mädchen', icon: 'baby' }, { id: 'jungen', name: 'Jungen', icon: 'baby' }],
                'elektronik': [{ id: 'handys', name: 'Handys', icon: 'smartphone' }, { id: 'konsolen', name: 'Konsolen', icon: 'gamepad' }]
            };
            const urlParams = new URLSearchParams(window.location.search);
            const cat = urlParams.get('category');
            if (cat && categoryData[cat]) {
                document.getElementById('smartFilterBar').style.display = 'block';
                document.getElementById('pageTitle').textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
                categoryData[cat].forEach(sub => {
                    const btn = document.createElement('button'); btn.className = 'filter-chip';
                    btn.innerHTML = `<i data-lucide="${sub.icon}"></i> ${sub.name}`;
                    document.getElementById('smartFilterWrapper').appendChild(btn);
                });
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        });
    </script>
