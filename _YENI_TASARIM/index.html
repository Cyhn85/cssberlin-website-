<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Berlin | Climate Smart Solutions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class', // Enabled manual dark mode toggling
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              heading: ['Montserrat', 'sans-serif'],
            },
            colors: {
              brand: {
                orange: '#FF8C42',
                green: '#165B33',
                darkGreen: '#0B2E1A',
                rust: '#c4621b',
                // Tinted Darks (instead of pure gray)
                deepBase: '#0a0f0d', // Very dark green-black
                panelBase: '#121816', // Slightly lighter
              },
            },
            animation: {
              marquee: 'marquee 30s linear infinite',
              "gradient-border": "gradient-border 6s ease-in-out infinite",
              "eco-flow": 'eco-flow 3s linear infinite',
            },
            keyframes: {
              marquee: {
                '0%': { transform: 'translateX(0%)' },
                '100%': { transform: 'translateX(-100%)' },
              },
              "eco-flow": {
                '0%': { backgroundPosition: '0% 50%' },
                '100%': { backgroundPosition: '200% 50%' },
              },
              "gradient-border": {
                "0%, 100%": { borderRadius: "37% 29% 27% 27% / 28% 25% 41% 37%" },
                "25%": { borderRadius: "47% 29% 39% 49% / 61% 19% 66% 26%" },
                "50%": { borderRadius: "57% 23% 47% 72% / 63% 17% 66% 33%" },
                "75%": { borderRadius: "28% 49% 29% 100% / 93% 20% 64% 25%" },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand: 50 100% 50%; 
      }

      /* STANDARD BACKGROUNDS */
      body {
        background-color: #f9fafb; /* gray-50 */
        color: #111827; /* gray-900 */
      }
      
      .dark body {
        background-color: #09090b; /* zinc-950 */
        color: #f3f4f6; /* gray-100 */
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .dark ::-webkit-scrollbar-track {
        background: rgba(0, 0, 0, 0.2); 
      }
      ::-webkit-scrollbar-thumb {
        background: #165B33;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF8C42;
      }
      
      /* --- RAINBOW BUTTON STYLES (UPDATED: Black Text on White Background) --- */
      .btn-rainbow {
        position: relative;
        background-color: #ffffff; /* White background for contrast */
        color: #000000; /* Black text as requested */
        border: none;
        cursor: pointer;
        z-index: 0;
        border-radius: 0.75rem; /* 12px */
        font-weight: 800; /* Extra bold for black text */
      }

      .btn-rainbow::before,
      .btn-rainbow::after {
        content: '';
        position: absolute;
        left: -2px;
        top: -2px;
        border-radius: 14px;
        /* Turuncu -> Beyaz -> Yeşil Gradyanı */
        background: linear-gradient(
          45deg, 
          #FF8C00, 
          #FFFFFF, 
          #22c55e, 
          #FF8C00, 
          #FFFFFF, 
          #22c55e
        );
        background-size: 400%;
        width: calc(100% + 4px);
        height: calc(100% + 4px);
        z-index: -1;
        animation: rainbow-move 20s linear infinite;
      }
      
      .btn-rainbow::after {
        filter: blur(20px);
        opacity: 0.7;
      }

      @keyframes rainbow-move {
        0% { background-position: 0 0; }
        50% { background-position: 400% 0; }
        100% { background-position: 0 0; }
      }

      /* Custom Eco Gradient for Product Cards (Orange -> White -> Green) */
      .eco-gradient-border {
        background: linear-gradient(90deg, #FF8C42, #ffffff, #165B33, #FF8C42);
        background-size: 300% 100%;
      }
      
      /* UTILS FOR ANIMATED FORM */
      .form-field {
        position: relative;
        margin-bottom: 1.5rem;
      }
      
      .form-field input {
        width: 100%;
        padding: 1.25rem 1rem 0.5rem;
        background: rgba(0, 0, 0, 0.2);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 0.75rem;
        color: white;
        outline: none;
        transition: all 0.3s ease;
      }
      
      .form-field label {
        position: absolute;
        left: 1rem;
        top: 1rem;
        color: rgba(255, 255, 255, 0.5);
        font-size: 0.875rem;
        pointer-events: none;
        transition: all 0.3s ease;
      }
      
      .form-field.active input,
      .form-field input:focus {
        border-color: currentColor; 
        background: rgba(0, 0, 0, 0.4);
      }
      
      .form-field.active label,
      .form-field input:focus ~ label {
        top: 0.4rem;
        font-size: 0.65rem;
        font-weight: bold;
        color: currentColor;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "clsx": "https://esm.sh/clsx@^2.1.0",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^2.2.1",
    "motion/react": "https://esm.sh/framer-motion@11.15.0",
    "motion/": "https://esm.sh/motion@^12.30.1/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="text-gray-900 dark:text-gray-100 transition-colors duration-300">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
