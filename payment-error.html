<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahlung fehlgeschlagen - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .error-container {
            max-width: 700px;
            margin: 60px auto;
            padding: 0 20px;
            text-align: center;
        }

        .error-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .error-icon svg {
            width: 50px;
            height: 50px;
            color: white;
        }

        .error-title {
            font-size: 32px;
            color: #d32f2f;
            margin-bottom: 15px;
        }

        .error-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #2D5016;
            color: white;
        }

        .btn-primary:hover {
            background: #1F3A0E;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </div>

        <h1 class="error-title">Zahlung fehlgeschlagen</h1>
        <p class="error-subtitle">Leider konnte Ihre Zahlung nicht verarbeitet werden. Bitte versuchen Sie es erneut.</p>

        <div class="action-buttons">
            <a href="checkout.html" class="btn btn-primary">
                Erneut versuchen
            </a>
        </div>
    </div>
</body>
</html>
