<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 CSS Berlin - AUTH QUICK TEST</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status.success {
            background: #e8f5e9;
            color: #388e3c;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        #output {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="footer-v3.css">
</head>

<body>
    <div id="header-placeholder"></div>
    <div class="container">
        <h1>🔥 CSS Berlin Auth Test</h1>
        <p style="color: #666; margin-bottom: 30px;">Schneller Backend Test - Direkt vom Browser</p>

        <div class="status info" id="status">
            Bereit zum Testen...
        </div>

        <div>
            <button onclick="testHealth()">🏥 Health Check</button>
            <button onclick="testLogin()">🔑 Login Test</button>
            <button onclick="testRegister()">📝 Register Test</button>
            <button onclick="testMagicLink()">✉️ Magic Link</button>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const API = 'http://localhost:8000';
        const output = document.getElementById('output');
        const status = document.getElementById('status');

        function log(msg) {
            const timestamp = new Date().toLocaleTimeString();
            output.textContent += `[${timestamp}] ${msg}\n`;
            output.scrollTop = output.scrollHeight;
        }

        function setStatus(msg, type = 'info') {
            status.textContent = msg;
            status.className = `status ${type}`;
        }

        async function testHealth() {
            log('🏥 Testing health endpoint...');
            setStatus('Testing...', 'info');

            try {
                const res = await fetch(`${API}/health`);
                const data = await res.json();
                log(`✅ Status: ${res.status}`);
                log(`Response: ${JSON.stringify(data, null, 2)}`);
                setStatus('✅ Backend is ONLINE!', 'success');
            } catch (e) {
                log(`❌ Error: ${e.message}`);
                setStatus('❌ Backend OFFLINE or CORS issue', 'error');
            }
        }

        async function testLogin() {
            log('\n🔑 Testing login...');
            setStatus('Logging in...', 'info');

            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'demo@cssberlin.de',
                        password: 'demo123'
                    })
                });

                log(`Status: ${res.status} ${res.statusText}`);

                if (res.ok) {
                    const data = await res.json();
                    log(`✅ LOGIN SUCCESS!`);
                    log(`Token: ${data.access_token.substring(0, 50)}...`);
                    log(`User: ${data.user_name}`);
                    setStatus('✅ Login erfolgreich!', 'success');
                } else {
                    const text = await res.text();
                    log(`❌ Login failed: ${text}`);
                    setStatus(`❌ Login failed (${res.status})`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`);
                setStatus('❌ Connection error', 'error');
            }
        }

        async function testRegister() {
            log('\n📝 Testing registration...');
            setStatus('Registering...', 'info');

            try {
                const randomEmail = `test${Date.now()}@cssberlin.de`;
                const res = await fetch(`${API}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: randomEmail,
                        password: 'testpass123',
                        firstName: 'Test',
                        lastName: 'User'
                    })
                });

                log(`Status: ${res.status}`);

                if (res.ok) {
                    const data = await res.json();
                    log(`✅ REGISTER SUCCESS!`);
                    log(`Email: ${randomEmail}`);
                    log(`Token: ${data.access_token.substring(0, 50)}...`);
                    setStatus('✅ Registrierung erfolgreich!', 'success');
                } else {
                    const text = await res.text();
                    log(`❌ Register failed: ${text}`);
                    setStatus(`❌ Register failed (${res.status})`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`);
                setStatus('❌ Connection error', 'error');
            }
        }

        async function testMagicLink() {
            log('\n✉️ Testing magic link...');
            setStatus('Sending magic link...', 'info');

            try {
                const res = await fetch(`${API}/api/auth/magic-link`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'demo@cssberlin.de'
                    })
                });

                log(`Status: ${res.status}`);

                if (res.ok) {
                    const data = await res.json();
                    log(`✅ Magic link sent!`);
                    log(`Response: ${JSON.stringify(data, null, 2)}`);
                    setStatus('✅ Magic Link gesendet!', 'success');
                } else {
                    const text = await res.text();
                    log(`❌ Failed: ${text}`);
                    setStatus(`❌ Failed (${res.status})`, 'error');
                }
            } catch (e) {
                log(`❌ Error: ${e.message}`);
                setStatus('❌ Connection error', 'error');
            }
        }

        // Auto-test on load
        window.addEventListener('load', () => {
            log('CSS Berlin Auth Test loaded!');
            log('Click buttons to test endpoints.\n');
        });
    </script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
<div id="footer-placeholder"></div>
    <script src="toast.js"></script>
    <script src="message-modal.js"></script>
</body>

</html>
