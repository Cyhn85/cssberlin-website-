<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geldbeutel - CSS Berlin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="footer-v3.css">
    <link rel="stylesheet" href="gradient-button.css">

    <script src="api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .page-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .page-container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h3 {
            margin-top: 0;
            font-family: 'Montserrat';
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .sidebar-links a {
            display: block;
            padding: 12px 0;
            color: #555;
            text-decoration: none;
            border-bottom: 1px solid #f9f9f9;
        }

        .sidebar-links a:hover,
        .sidebar-links a.active {
            color: #2D5016;
            font-weight: 600;
            padding-left: 5px;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            min-height: 500px;
        }

        .main-content h1 {
            margin-top: 0;
            font-family: 'Montserrat';
            color: #2D5016;
        }

        .profile-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f0f0f0;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="page-container">
        <aside class="sidebar">
            <h3>Mein Konto</h3>
            <div class="sidebar-links">
                <a href="mein-profil.html">Mein Profil</a>
                <a href="geldbeutel.html" class="active">Geldbeutel</a>
                <a href="meine-bestellungen.html">Meine Bestellungen</a>
                <a href="meine-einstellungen.html">Einstellungen</a>
                <a href="freunde-einladen.html">Freunde einladen</a>
                <a href="spenden.html">Spenden</a>
            </div>
        </aside>

        <main class="main-content">
            <h1>Mein Geldbeutel</h1>
            
            <div style="background:#f0fdf4; border:1px solid #bbf7d0; padding:30px; border-radius:12px; text-align:center; margin-bottom:40px;">
                <div style="font-size:16px; color:#166534; margin-bottom:10px;">Verfügbares Guthaben</div>
                <div style="font-size:48px; font-weight:800; color:#15803d;">75,55 €</div>
                <div style="margin-top:20px; display:flex; gap:15px; justify-content:center;">
                    <button class="btn-gradient" style="border:none; cursor:pointer;">Auszahlen</button>
                </div>
            </div>
            <h3>Transaktionen</h3>
            <table style="width:100%; border-collapse:collapse;">
                <tr style="border-bottom:2px solid #eee; text-align:left;">
                    <th style="padding:10px;">Datum</th>
                    <th style="padding:10px;">Beschreibung</th>
                    <th style="padding:10px; text-align:right;">Betrag</th>
                </tr>
                <tr style="border-bottom:1px solid #eee;">
                    <td style="padding:10px;">06.02.2026</td>
                    <td style="padding:10px;">Verkauf: Adidas Sneaker</td>
                    <td style="padding:10px; text-align:right; color:green;">+45,00 €</td>
                </tr>
                <tr style="border-bottom:1px solid #eee;">
                    <td style="padding:10px;">01.02.2026</td>
                    <td style="padding:10px;">Auszahlung an Bankkonto</td>
                    <td style="padding:10px; text-align:right;">-120,00 €</td>
                </tr>
            </table>
        
    </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script src="user-menu.js"></script>

    <script>
        window.addEventListener('load', async function () {
            if (window.Clerk) {
                await window.Clerk.load();
                const user = window.Clerk.user;
                if (user) {
                    const header = document.getElementById('profileHeader');
                    header.innerHTML = `
                        <img src="${user.imageUrl}" class="profile-avatar">
                        <div>
                            <h2 style="margin:0;">${user.fullName || user.username}</h2> 
                            <p style="margin:5px 0; color:#666;">Mitglied seit ${new Date(user.createdAt).getFullYear()}</p>
                            <p style="margin:0; color:#2D5016;">Verifizierter Nutzer ✅</p>
                        </div>
                    `;
                }
            }
        });
    </script>
    <script src="toast.js"></script>
    <script src="message-modal.js"></script>
</body>

</html>
