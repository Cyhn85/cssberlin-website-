<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Berlin - Muhasebe Sistemi</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CSS Berlin Muhasebe Sistemi</h1>
            <nav>
                <a href="#dashboard" class="nav-link active">Dashboard</a>
                <a href="#transactions" class="nav-link">İşlemler</a>
                <a href="#reports" class="nav-link">Beyannameler</a>
                <a href="#reminders" class="nav-link">Hatırlatmalar</a>
                <a href="#compliance" class="nav-link">Uyumluluk</a>
            </nav>
        </header>

        <main>
            <!-- Dashboard -->
            <section id="dashboard" class="section active">
                <h2>Dashboard</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>Toplam Gelir</h3>
                        <p class="stat-value" id="total-income">0.00 €</p>
                    </div>
                    <div class="stat-card">
                        <h3>Toplam Gider</h3>
                        <p class="stat-value" id="total-expense">0.00 €</p>
                    </div>
                    <div class="stat-card">
                        <h3>Net Sonuç</h3>
                        <p class="stat-value" id="net-result">0.00 €</p>
                    </div>
                    <div class="stat-card">
                        <h3>KDV Limit Kullanımı</h3>
                        <p class="stat-value" id="vat-limit">0%</p>
                    </div>
                </div>
            </section>

            <!-- Transactions -->
            <section id="transactions" class="section">
                <h2>İşlemler</h2>
                <div class="actions">
                    <button class="btn btn-primary" onclick="showAddTransaction()">Yeni İşlem Ekle</button>
                    <button class="btn btn-secondary" onclick="checkDuplicates()">Tekrarları Kontrol Et</button>
                </div>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tarih</th>
                            <th>Platform</th>
                            <th>Tip</th>
                            <th>Açıklama</th>
                            <th>Tutar</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-table">
                        <!-- Dinamik içerik -->
                    </tbody>
                </table>
            </section>

            <!-- Reports -->
            <section id="reports" class="section">
                <h2>Beyannameler</h2>
                <div class="actions">
                    <button class="btn btn-primary" onclick="generateEuerReport()">EÜR Beyannamesi Oluştur</button>
                    <button class="btn btn-secondary" onclick="generatePlatformReport()">Platform T-Cetveli</button>
                </div>
                <div id="reports-list">
                    <!-- Dinamik içerik -->
                </div>
            </section>

            <!-- Reminders -->
            <section id="reminders" class="section">
                <h2>Hatırlatmalar</h2>
                <div id="reminders-list">
                    <!-- Dinamik içerik -->
                </div>
            </section>

            <!-- Compliance -->
            <section id="compliance" class="section">
                <h2>Uyumluluk Kontrolü</h2>
                <div id="compliance-status">
                    <!-- Dinamik içerik -->
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
