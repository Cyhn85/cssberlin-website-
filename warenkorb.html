<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warenkorb - CSS Berlin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Standard Styles -->
    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    
    <link rel="stylesheet" href="product-card-glass.css">
    <link rel="stylesheet" href="footer-v3.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #111827;
            min-height: 100vh;
        }

        /* Cart Page Specific Styles */
        .cart-page-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #111827;
        }

        .cart-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 30px;
        }

        .cart-items-panel {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
        }

        .cart-header-row {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-count-label {
            font-weight: 600;
            color: #111827;
        }

        .clear-cart-btn {
            color: #ef4444;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clear-cart-btn:hover {
            text-decoration: underline;
        }

        /* Cart Item */
        .cart-item {
            padding: 24px;
            border-bottom: 1px solid #e5e7eb;
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 20px;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item-img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: #f3f4f6;
        }

        .cart-item-info h3 {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .cart-item-meta {
            font-size: 13px;
            color: #6b7280;
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }

        .cart-item-price {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #2D5016;
        }

        .remove-btn {
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }

        .remove-btn:hover {
            color: #ef4444;
        }

        /* Summary Panel */
        .summary-panel {
            background: white;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            padding: 24px;
            height: fit-content;
        }

        .summary-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 14px;
            color: #4b5563;
        }

        .summary-total {
            border-top: 1px solid #e5e7eb;
            padding-top: 16px;
            margin-top: 16px;
            font-weight: 700;
            font-size: 18px;
            color: #111827;
            display: flex;
            justify-content: space-between;
        }

        .checkout-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF8C42 0%, #d4753d 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            margin-top: 24px;
            transition: all 0.2s;
        }

        .checkout-btn:hover {
            background: linear-gradient(135deg, #2D5016 0%, #3d6b1e 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(45, 80, 22, 0.2);
        }

        /* Empty State */
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 48px;
            color: #d1d5db;
            margin-bottom: 20px;
            display: block;
        }

        @media (max-width: 768px) {
            .cart-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER V3 (Standard) -->
    
    </div>

    
    
    <div id="header-placeholder"></div>



    <!-- CONTENT -->
    <div class="cart-page-container">
        <div class="page-header">
            <h1 class="page-title">Warenkorb</h1>
        </div>

        <div class="cart-grid">
            <!-- Left: Items -->
            <div class="cart-items-panel">
                <div class="cart-header-row">
                    <span class="cart-count-label"><span id="cartItemCount">0</span> Produkte</span>
                    <button class="clear-cart-btn" id="clearCartBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                        </svg>
                        Leeren
                    </button>
                </div>
                <div id="cartItemsList">
                    <!-- JS Injected -->
                </div>
            </div>

            <!-- Right: Summary -->
            <div class="summary-panel">
                <h2 class="summary-title">Zusammenfassung</h2>
                <div class="summary-row">
                    <span>Zwischensumme</span>
                    <span id="subtotalAmount">0,00€</span>
                </div>
                <div class="summary-row">
                    <span>Versand</span>
                    <span id="shippingAmount">4,99€</span>
                </div>
                <div class="summary-total">
                    <span>Gesamt</span>
                    <span id="totalAmount">0,00€</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">ZUR KASSE</button>
                <div style="text-align:center; margin-top:12px;">
                    <a href="index.html" style="color:#6b7280; font-size:13px; text-decoration:none;">Weiter
                        einkaufen</a>
                </div>
            </div>
        </div>
    </div>

    <script src="auth-modal-v3.js"></script>
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>

    
    
    <div id="footer-placeholder"></div>


    <script>
        // Simple Cart Logic ported from previous file
        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('cssberlin_cart') || '[]');
            const listFn = document.getElementById('cartItemsList');
            const countFn = document.getElementById('cartItemCount');
            const headerCount = document.getElementById('headerCartCount');

            if (countFn) countFn.textContent = cart.length;
            if (headerCount && cart.length > 0) {
                headerCount.style.display = 'flex';
                headerCount.textContent = cart.length;
            }

            if (cart.length === 0) {
                listFn.innerHTML = `
                    <div class="empty-cart">
                        <span class="empty-icon">🛒</span>
                        <h3>Ihr Warenkorb ist leer</h3>
                        <p style="color:#666; margin-top:8px;">Stöbern Sie in unseren Kategorien.</p>
                        <a href="index.html" class="checkout-btn" style="display:inline-block; width:auto; margin-top:20px; text-decoration:none;">Jetzt einkaufen</a>
                    </div>`;
                updateSummary(0);
                return;
            }

            listFn.innerHTML = cart.map((item, index) => {
                let price = typeof item.price === 'number' ? item.price : parseFloat(item.price.replace('€', '').replace(',', '.'));
                if (isNaN(price)) price = 0;

                return `
                <div class="cart-item">
                    <img src="${item.image || 'https://via.placeholder.com/100'}" class="cart-item-img">
                    <div class="cart-item-info">
                        <h3>${item.name || 'Produkt'}</h3>
                        <div class="cart-item-meta">
                            <span>Größe: ${item.size || '-'}</span>
                            <span>Zustand: Sehr gut</span>
                        </div>
                    </div>
                    <div class="cart-item-right" style="text-align:right;">
                        <div class="cart-item-price">${price.toFixed(2).replace('.', ',')}€</div>
                        <button class="remove-btn" onclick="removeFromCart(${index})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg>
                        </button>
                    </div>
                </div>`;
            }).join('');

            let subtotal = 0;
            cart.forEach(item => {
                let p = typeof item.price === 'number' ? item.price : parseFloat(item.price.replace('€', '').replace(',', '.'));
                if (!isNaN(p)) subtotal += p;
            });
            updateSummary(subtotal);
        }

        function updateSummary(subtotal) {
            const shipping = subtotal > 0 ? 4.99 : 0;
            const total = subtotal + shipping;
            document.getElementById('subtotalAmount').textContent = subtotal.toFixed(2).replace('.', ',') + '€';
            document.getElementById('shippingAmount').textContent = shipping.toFixed(2).replace('.', ',') + '€';
            document.getElementById('totalAmount').textContent = total.toFixed(2).replace('.', ',') + '€';
        }

        window.removeFromCart = function (index) {
            let cart = JSON.parse(localStorage.getItem('cssberlin_cart') || '[]');
            cart.splice(index, 1);
            localStorage.setItem('cssberlin_cart', JSON.stringify(cart));
            loadCart();
        };

        document.getElementById('clearCartBtn').addEventListener('click', () => {
            localStorage.removeItem('cssberlin_cart');
            loadCart();
        });

        loadCart();
    </script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
</body>

</html>
