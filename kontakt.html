<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - CSS Berlin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Standardized Styles -->
    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="footer-v3.css">
    <link rel="stylesheet" href="gradient-button.css">

    <style>
        :root {
            --brand-dark-green: #2D5016;
            --brand-green-light: #3d6b1e;
            --brand-orange: #FF8C42;
            --brand-orange-hover: #e07b3a;
            --text-dark: #111827;
            --bg-light: #f5f5f5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-light);
            color: var(--text-dark);
            margin: 0;
            padding: 0;
        }

        .contact-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        @media (max-width: 968px) {
            .contact-container {
                grid-template-columns: 1fr;
            }
        }

        .contact-info-panel h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 42px;
            font-weight: 800;
            color: var(--brand-dark-green);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .contact-info-panel p {
            font-size: 18px;
            color: #4b5563;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .info-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 20px;
            transition: transform 0.2s;
        }

        .info-card:hover {
            transform: translateY(-2px);
        }

        .info-icon {
            background: rgba(45, 80, 22, 0.1);
            color: var(--brand-dark-green);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .info-content h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            font-weight: 700;
        }

        .info-content div {
            color: #666;
            font-size: 15px;
            line-height: 1.5;
        }

        .info-content a {
            color: var(--brand-orange);
            text-decoration: none;
            font-weight: 600;
        }

        /* Form Styles */
        .contact-form-panel {
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -5px rgba(0, 0, 0, 0.1);
        }

        .contact-form-panel h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            margin-bottom: 25px;
            color: #111;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--brand-orange);
            background: white;
            box-shadow: 0 0 0 4px rgba(255, 140, 66, 0.1);
        }

        .submit-btn {
            background: linear-gradient(135deg, #FF8C42 0%, #E8854C 100%);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 20px rgba(255, 140, 66, 0.2);
        }
    </style>

    <script src="api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>
</head>

<body>
    <!-- HEADER PLACEHOLDER -->
    <div id="header-placeholder"></div>

    <div class="contact-container">
        <!-- Left Side: Info -->
        <div class="contact-info-panel">
            <h1>Kontaktieren Sie uns</h1>
            <p>Wir helfen Ihnen gerne weiter beim Kauf, Verkauf oder Fragen zur Nachhaltigkeit.</p>

            <div class="info-card">
                <div class="info-icon"><i data-lucide="map-pin"></i></div>
                <div class="info-content">
                    <h3>Besuchen Sie uns</h3>
                    <div>
                        CSS Berlin<br>
                        Am Omnibushof 12<br>
                        13593 Berlin
                    </div>
                </div>
            </div>

            <div class="info-card">
                <div class="info-icon"><i data-lucide="phone"></i></div>
                <div class="info-content">
                    <h3>Anrufen</h3>
                    <div>
                        Mo-Fr: 09:00 - 18:00 Uhr<br>
                        <a href="tel:+491632634020">+49 163 263 40 20</a>
                    </div>
                </div>
            </div>

            <div class="info-card">
                <div class="info-icon"><i data-lucide="mail"></i></div>
                <div class="info-content">
                    <h3>E-Mail</h3>
                    <div>
                        Antwort innerhalb von 24 Std.<br>
                        <a href="mailto:info@cssberlin.de">info@cssberlin.de</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Side: Form -->
        <div class="contact-form-panel">
            <h2>Nachricht senden</h2>
            <form id="contactForm" onsubmit="handleContactSubmit(event)">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" placeholder="Ihr Name" required>
                </div>
                <div class="form-group">
                    <label>E-Mail-Adresse</label>
                    <input type="email" class="form-control" placeholder="ihre@email.de" required>
                </div>
                <div class="form-group">
                    <label>Betreff</label>
                    <select class="form-control">
                        <option>Allgemeine Anfrage</option>
                        <option>Bestellung & Versand</option>
                        <option>Rückgabe</option>
                        <option>Partner werden</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nachricht</label>
                    <textarea class="form-control" rows="5" placeholder="Wie können wir Ihnen helfen?"
                        required></textarea>
                </div>
                <button type="submit" class="submit-btn">
                    <i data-lucide="send"></i> Nachricht absenden
                </button>
            </form>
        </div>
    </div>

    <!-- FOOTER PLACEHOLDER -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script>
        function handleContactSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;

            btn.innerHTML = '<i data-lucide="loader-2" class="animate-spin"></i> Wird gesendet...';
            btn.disabled = true;

            // Simulate sending
            setTimeout(() => {
                btn.innerHTML = '<i data-lucide="check"></i> Gesendet!';
                btn.style.background = '#2D5016';
                e.target.reset();

                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.style.background = '';
                    btn.disabled = false;
                }, 3000);
            }, 1500);
        }

        // Init Icons
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });
    </script>
</body>

</html>
