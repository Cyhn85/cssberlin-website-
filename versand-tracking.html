<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sendungsverfolgung - CSS Berlin</title>
    <meta name="description" content="Verfolgen Sie Ihre Sendung bei CSS Berlin - DHL, Hermes, DPD, GLS">
    <link rel="stylesheet" href="styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ============================================
           VERSAND TRACKING PAGE STYLES
           ============================================ */

        .tracking-hero {
            background: linear-gradient(135deg, var(--primary-green) 0%, #1a3009 100%);
            padding: var(--spacing-3xl) var(--spacing-lg);
            text-align: center;
            color: var(--text-white);
        }

        .tracking-hero h1 {
            font-size: 2.5rem;
            font-weight: var(--font-weight-bold);
            margin-bottom: var(--spacing-md);
        }

        .tracking-hero p {
            font-size: 1.1rem;
            opacity: 0.9;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Search Form */
        .tracking-search-container {
            max-width: 800px;
            margin: -40px auto var(--spacing-2xl);
            padding: 0 var(--spacing-lg);
            position: relative;
            z-index: 10;
        }

        .tracking-search-box {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-xl);
            padding: var(--spacing-xl);
        }

        .tracking-search-form {
            display: flex;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .tracking-input-group {
            flex: 1;
            min-width: 250px;
        }

        .tracking-input-group label {
            display: block;
            font-weight: var(--font-weight-semibold);
            margin-bottom: var(--spacing-sm);
            color: var(--text-primary);
        }

        .tracking-input {
            width: 100%;
            padding: var(--spacing-md);
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: var(--transition-base);
        }

        .tracking-input:focus {
            outline: none;
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.2);
        }

        .tracking-btn {
            background: var(--primary-orange);
            color: var(--text-white);
            border: none;
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: var(--font-weight-semibold);
            cursor: pointer;
            transition: var(--transition-base);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            align-self: flex-end;
        }

        .tracking-btn:hover {
            background: var(--primary-orange-hover);
            transform: translateY(-2px);
        }

        /* Results Container */
        .tracking-results {
            max-width: 1000px;
            margin: 0 auto var(--spacing-3xl);
            padding: 0 var(--spacing-lg);
        }

        /* Status Card */
        .tracking-status-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            margin-bottom: var(--spacing-xl);
        }

        .tracking-status-header {
            background: var(--accent-green);
            padding: var(--spacing-lg);
            border-bottom: 3px solid var(--primary-green);
        }

        .tracking-status-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .tracking-number-display {
            font-size: 1.3rem;
            font-weight: var(--font-weight-bold);
            color: var(--primary-green);
        }

        .carrier-badge {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--bg-primary);
            border-radius: var(--radius-full);
            font-weight: var(--font-weight-semibold);
        }

        .carrier-badge img {
            height: 24px;
            width: auto;
        }

        .tracking-status-body {
            padding: var(--spacing-xl);
        }

        /* Current Status */
        .current-status {
            text-align: center;
            padding: var(--spacing-xl) 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: var(--spacing-xl);
        }

        .status-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-md);
            font-size: 2rem;
        }

        .status-icon.pending {
            background: var(--accent-orange);
            color: var(--warning);
        }

        .status-icon.shipped {
            background: var(--accent-green);
            color: var(--primary-green);
        }

        .status-icon.in_transit {
            background: #FFF3E0;
            color: var(--primary-orange);
        }

        .status-icon.out_for_delivery {
            background: #FFF3E0;
            color: var(--primary-orange);
        }

        .status-icon.delivered {
            background: #E8F5E9;
            color: var(--success);
        }

        .status-text {
            font-size: 1.5rem;
            font-weight: var(--font-weight-bold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .status-location {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .estimated-delivery {
            display: inline-block;
            margin-top: var(--spacing-md);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--accent-green);
            border-radius: var(--radius-md);
            color: var(--primary-green);
            font-weight: var(--font-weight-semibold);
        }

        /* Progress Bar */
        .tracking-progress {
            margin-bottom: var(--spacing-xl);
        }

        .progress-steps {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .progress-steps::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            right: 10%;
            height: 4px;
            background: var(--border-color);
            z-index: 1;
        }

        .progress-steps::after {
            content: '';
            position: absolute;
            top: 20px;
            left: 10%;
            height: 4px;
            background: var(--primary-green);
            z-index: 2;
            transition: width 0.5s ease;
        }

        .progress-steps.step-1::after { width: 0%; }
        .progress-steps.step-2::after { width: 26%; }
        .progress-steps.step-3::after { width: 53%; }
        .progress-steps.step-4::after { width: 80%; }

        .progress-step {
            text-align: center;
            position: relative;
            z-index: 3;
        }

        .step-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 3px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto var(--spacing-sm);
            font-size: 1rem;
            color: var(--text-light);
            transition: var(--transition-base);
        }

        .progress-step.active .step-icon,
        .progress-step.completed .step-icon {
            background: var(--primary-green);
            border-color: var(--primary-green);
            color: var(--text-white);
        }

        .progress-step.active .step-icon {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(45, 80, 22, 0.4); }
            50% { box-shadow: 0 0 0 10px rgba(45, 80, 22, 0); }
        }

        .step-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: var(--font-weight-medium);
        }

        .progress-step.active .step-label,
        .progress-step.completed .step-label {
            color: var(--primary-green);
            font-weight: var(--font-weight-semibold);
        }

        /* Tracking History */
        .tracking-history {
            margin-top: var(--spacing-xl);
        }

        .history-title {
            font-size: 1.1rem;
            font-weight: var(--font-weight-bold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .history-timeline {
            position: relative;
            padding-left: var(--spacing-xl);
        }

        .history-timeline::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .history-event {
            position: relative;
            padding-bottom: var(--spacing-lg);
        }

        .history-event:last-child {
            padding-bottom: 0;
        }

        .history-event::before {
            content: '';
            position: absolute;
            left: -24px;
            top: 4px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--border-color);
            border: 2px solid var(--bg-primary);
        }

        .history-event:first-child::before {
            background: var(--primary-green);
            width: 14px;
            height: 14px;
            left: -25px;
        }

        .event-time {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-xs);
        }

        .event-status {
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .event-location {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
        }

        /* Product Info Card */
        .product-info-card {
            background: var(--bg-tertiary);
            border-radius: var(--radius-md);
            padding: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            margin-top: var(--spacing-xl);
        }

        .product-info-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-md);
            object-fit: cover;
        }

        .product-info-details {
            flex: 1;
        }

        .product-info-name {
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .product-info-price {
            color: var(--primary-orange);
            font-weight: var(--font-weight-bold);
        }

        /* External Tracking Link */
        .external-tracking {
            text-align: center;
            padding: var(--spacing-lg);
            background: var(--accent-orange);
            border-radius: var(--radius-md);
            margin-top: var(--spacing-xl);
        }

        .external-tracking p {
            margin-bottom: var(--spacing-md);
            color: var(--text-secondary);
        }

        .external-tracking-btn {
            display: inline-flex;
            align-items: center;
            gap: var(--spacing-sm);
            background: var(--primary-orange);
            color: var(--text-white);
            padding: var(--spacing-md) var(--spacing-xl);
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: var(--font-weight-semibold);
            transition: var(--transition-base);
        }

        .external-tracking-btn:hover {
            background: var(--primary-orange-hover);
            transform: translateY(-2px);
        }

        /* QR + Copy */
        .share-row {
            margin-top: var(--spacing-lg);
            display: flex;
            gap: var(--spacing-lg);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .qr-card {
            background: var(--bg-primary);
            border: 1px solid rgba(45, 80, 22, 0.12);
            border-radius: var(--radius-lg);
            padding: var(--spacing-md);
            box-shadow: var(--shadow-sm);
            text-align: center;
            min-width: 200px;
        }
        .qr-card img {
            width: 160px;
            height: 160px;
            border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.06);
            background: white;
        }
        .qr-card .qr-caption {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .copy-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .copy-link {
            background: rgba(255,255,255,0.75);
            border: 1px solid rgba(45, 80, 22, 0.15);
            border-radius: 10px;
            padding: 10px 12px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 12px;
            max-width: 520px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .copy-btn {
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-orange) 0%, var(--primary-orange-dark) 100%);
            color: white;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
        }

        /* My Shipments Section */
        .my-shipments {
            max-width: 1000px;
            margin: 0 auto var(--spacing-3xl);
            padding: 0 var(--spacing-lg);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: var(--font-weight-bold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-lg);
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .shipment-card {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: var(--spacing-lg);
            margin-bottom: var(--spacing-md);
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
            transition: var(--transition-base);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .shipment-card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--primary-orange);
        }

        .shipment-image {
            width: 60px;
            height: 60px;
            border-radius: var(--radius-md);
            object-fit: cover;
        }

        .shipment-details {
            flex: 1;
        }

        .shipment-name {
            font-weight: var(--font-weight-semibold);
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .shipment-tracking {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .shipment-status {
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-full);
            font-size: 0.85rem;
            font-weight: var(--font-weight-semibold);
        }

        .shipment-status.pending {
            background: var(--accent-orange);
            color: var(--warning);
        }

        .shipment-status.shipped,
        .shipment-status.in_transit {
            background: #FFF3E0;
            color: var(--primary-orange);
        }

        .shipment-status.out_for_delivery {
            background: #FFF3E0;
            color: var(--primary-orange);
        }

        .shipment-status.delivered {
            background: #E8F5E9;
            color: var(--success);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: var(--spacing-3xl);
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: var(--spacing-lg);
        }

        .empty-state h3 {
            font-size: 1.3rem;
            color: var(--text-primary);
            margin-bottom: var(--spacing-sm);
        }

        /* Loading */
        .loading-spinner {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-3xl);
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--border-color);
            border-top-color: var(--primary-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .tracking-hero h1 {
                font-size: 1.8rem;
            }

            .tracking-search-form {
                flex-direction: column;
            }

            .tracking-btn {
                width: 100%;
                justify-content: center;
            }

            .progress-steps {
                flex-wrap: wrap;
                gap: var(--spacing-md);
            }

            .progress-steps::before,
            .progress-steps::after {
                display: none;
            }

            .shipment-card {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

    <main class="page-main">

    </section>

    <!-- Search Box -->
    <div class="tracking-search-container">
        <div class="tracking-search-box">
            <form class="tracking-search-form" id="trackingForm">
                <div class="tracking-input-group">
                    <label for="trackingNumber">Sendungsnummer eingeben</label>

                        type="text"
                        id="trackingNumber"
                        class="tracking-input"
                        placeholder="z.B. 123456789012"

                    >

    <script>
        // Status translations
        const STATUS_LABELS = {
            'pending': 'Versand vorbereitet',
            'label_created': 'Etikett erstellt',
            'shipped': 'Versendet',
            'in_transit': 'Unterwegs',
            'out_for_delivery': 'In Zustellung',
            'delivered': 'Zugestellt',
            'returned': 'Zurückgesendet'
        };

        const STATUS_ICONS = {
            'pending': 'fa-box',
            'label_created': 'fa-tag',
            'shipped': 'fa-truck-loading',
            'in_transit': 'fa-truck',
            'out_for_delivery': 'fa-truck-fast',
            'delivered': 'fa-check-circle',
            'returned': 'fa-rotate-left'
        };

        // Format date
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return date.toLocaleDateString('de-DE', {
                day: '2-digit',
                month: '2-digit',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Get progress step number
        function getProgressStep(status) {
            const steps = ['pending', 'shipped', 'in_transit', 'delivered'];
            const index = steps.indexOf(status);
            if (status === 'out_for_delivery') return 3;
            return index >= 0 ? index + 1 : 1;
        }

        function buildTrackingUrlForShare(data) {
            const tn = encodeURIComponent(data.tracking_number || '');
            return `${window.location.origin}${window.location.pathname}?tracking=${tn}`;
        }

        function buildQrImg(url) {
            const encoded = encodeURIComponent(url);
            return `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encoded}`;
        }

        async function copyToClipboard(text) {
            try {
                await navigator.clipboard.writeText(text);
                if (typeof toast !== 'undefined' && toast.success) toast.success('Kopiert', 'Link wurde kopiert.');
            } catch (e) {
                const ta = document.createElement('textarea');
                ta.value = text;
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                ta.remove();
                if (typeof toast !== 'undefined' && toast.success) toast.success('Kopiert', 'Link wurde kopiert.');
            }
        }

        // Render tracking result
        function renderTrackingResult(data) {
            const resultsDiv = document.getElementById('trackingResults');
            const stepNum = getProgressStep(data.status);
            const shareUrl = buildTrackingUrlForShare(data);

            resultsDiv.innerHTML = `
                <div class="tracking-status-card">
                    <div class="tracking-status-header">
                        <div class="tracking-status-title">
                            <span class="tracking-number-display">
                                <i class="fas fa-barcode"></i> ${data.tracking_number || 'N/A'}
                            </span>
                            <span class="carrier-badge">
                                <i class="fas fa-truck"></i>
                                ${data.carrier ? data.carrier.toUpperCase() : 'Unbekannt'}
                            </span>
                        </div>
                    </div>
                    <div class="tracking-status-body">
                        <!-- Current Status -->
                        <div class="current-status">
                            <div class="status-icon ${data.status}">
                                <i class="fas ${STATUS_ICONS[data.status] || 'fa-box'}"></i>
                            </div>
                            <div class="status-text">${STATUS_LABELS[data.status] || data.status}</div>
                            <div class="status-location">
                                <i class="fas fa-map-marker-alt"></i>
                                ${data.last_location || 'Standort wird ermittelt...'}
                            </div>
                            ${data.estimated_delivery ? `
                                <div class="estimated-delivery">
                                    <i class="fas fa-calendar-check"></i>
                                    Voraussichtliche Lieferung: ${formatDate(data.estimated_delivery)}
                                </div>
                            ` : ''}
                        </div>

                        <!-- Progress Bar -->
                        <div class="tracking-progress">
                            <div class="progress-steps step-${stepNum}">
                                <div class="progress-step ${stepNum >= 1 ? 'completed' : ''} ${stepNum === 1 ? 'active' : ''}">
                                    <div class="step-icon"><i class="fas fa-box"></i></div>
                                    <div class="step-label">Vorbereitet</div>
                                </div>
                                <div class="progress-step ${stepNum >= 2 ? 'completed' : ''} ${stepNum === 2 ? 'active' : ''}">
                                    <div class="step-icon"><i class="fas fa-truck-loading"></i></div>
                                    <div class="step-label">Versendet</div>
                                </div>
                                <div class="progress-step ${stepNum >= 3 ? 'completed' : ''} ${stepNum === 3 ? 'active' : ''}">
                                    <div class="step-icon"><i class="fas fa-truck"></i></div>
                                    <div class="step-label">Unterwegs</div>
                                </div>
                                <div class="progress-step ${stepNum >= 4 ? 'completed' : ''} ${stepNum === 4 ? 'active' : ''}">
                                    <div class="step-icon"><i class="fas fa-check"></i></div>
                                    <div class="step-label">Zugestellt</div>
                                </div>
                            </div>
                        </div>

                        <!-- Tracking History -->
                        ${data.tracking_history && data.tracking_history.length > 0 ? `
                            <div class="tracking-history">
                                <h3 class="history-title">
                                    <i class="fas fa-history"></i>
                                    Sendungsverlauf
                                </h3>
                                <div class="history-timeline">
                                    ${data.tracking_history.slice().reverse().map(event => `
                                        <div class="history-event">
                                            <div class="event-time">${formatDate(event.timestamp)}</div>
                                            <div class="event-status">${STATUS_LABELS[event.status] || event.status}</div>
                                            <div class="event-location">
                                                <i class="fas fa-map-marker-alt"></i>
                                                ${event.location || '-'}
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Product Info -->
                        ${data.product_name ? `
                            <div class="product-info-card">
                                <img
                                    src="${data.product_image || 'https://via.placeholder.com/80x80?text=Produkt'}"
                                    alt="${data.product_name}"
                                    class="product-info-image"
                                >
                                <div class="product-info-details">
                                    <div class="product-info-name">${data.product_name}</div>
                                    ${data.product_price ? `
                                        <div class="product-info-price">${data.product_price.toFixed(2)} €</div>
                                    ` : ''}
                                </div>
                            </div>
                        ` : ''}

                        <!-- External Tracking -->
                        ${data.tracking_url && data.tracking_number ? `
                            <div class="external-tracking">
                                <p>Detaillierte Tracking-Informationen beim Versanddienstleister:</p>
                                <a href="${data.tracking_url}" target="_blank" class="external-tracking-btn">
                                    <i class="fas fa-external-link-alt"></i>
                                    Bei ${data.carrier ? data.carrier.toUpperCase() : 'Versanddienstleister'} verfolgen
                                </a>
                            </div>
                        ` : ''}

                        <!-- Share (QR + Copy) -->
                        ${data.tracking_number ? `
                            <div class="share-row">
                                <div class="qr-card">
                                    <img src="${buildQrImg(shareUrl)}" alt="QR Code">
                                    <div class="qr-caption">QR: Tracking-Seite teilen</div>
                                </div>
                                <div>
                                    <div class="copy-row">
                                        <div class="copy-link" title="${shareUrl}">${shareUrl}</div>
                                        <button class="copy-btn" type="button" id="copyTrackingLinkBtn">Link kopieren</button>
                                    </div>
                                    <div class="qr-caption" style="margin-top:10px;">
                                        Tipp: QR veya link ile alıcıya gönderin.
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            resultsDiv.style.display = 'block';

            const copyBtn = document.getElementById('copyTrackingLinkBtn');
            if (copyBtn) copyBtn.addEventListener('click', () => copyToClipboard(shareUrl));
        }

        // Render my shipments list
        function renderMyShipments(shipments) {
            const listDiv = document.getElementById('shipmentsList');

            if (!shipments || shipments.length === 0) {
                listDiv.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-box-open"></i>
                        <h3>Keine Sendungen</h3>
                        <p>Sie haben noch keine aktiven Sendungen.</p>
                    </div>
                `;
                return;
            }

            listDiv.innerHTML = shipments.map(shipment => `
                <div class="shipment-card" onclick="trackShipment('${shipment.tracking_number}')">
                    <img
                        src="${shipment.product_image || 'https://via.placeholder.com/60x60?text=Produkt'}"
                        alt="${shipment.product_name}"
                        class="shipment-image"
                    >
                    <div class="shipment-details">
                        <div class="shipment-name">${shipment.product_name}</div>
                        <div class="shipment-tracking">
                            ${shipment.carrier ? shipment.carrier.toUpperCase() : ''}
                            ${shipment.tracking_number || 'Tracking wird erstellt...'}
                        </div>
                    </div>
                    <span class="shipment-status ${shipment.status}">
                        ${STATUS_LABELS[shipment.status] || shipment.status}
                    </span>
                </div>
            `).join('');
        }

        // Track shipment by number
        async function trackShipment(trackingNumber) {
            if (!trackingNumber) return;

            document.getElementById('trackingNumber').value = trackingNumber;

            const resultsDiv = document.getElementById('trackingResults');
            resultsDiv.innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            `;
            resultsDiv.style.display = 'block';

            try {
                const data = await api.trackShipment(trackingNumber);
                renderTrackingResult(data);
            } catch (error) {
                resultsDiv.innerHTML = `
                    <div class="tracking-status-card">
                        <div class="tracking-status-body">
                            <div class="empty-state">
                                <i class="fas fa-search"></i>
                                <h3>Sendung nicht gefunden</h3>
                                <p>Die eingegebene Sendungsnummer konnte nicht gefunden werden. Bitte überprüfen Sie die Nummer und versuchen Sie es erneut.</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Load user's shipments
        async function loadMyShipments() {
            if (!api.isLoggedIn()) {
                document.getElementById('myShipments').style.display = 'none';
                return;
            }

            document.getElementById('myShipments').style.display = 'block';
            document.getElementById('shipmentsList').innerHTML = `
                <div class="loading-spinner">
                    <div class="spinner"></div>
                </div>
            `;

            try {
                const response = await api.getShipments();
                renderMyShipments(response.shipments);
            } catch (error) {
                console.error('Failed to load shipments:', error);
                document.getElementById('shipmentsList').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Fehler beim Laden</h3>
                        <p>Sendungen konnten nicht geladen werden.</p>
                    </div>
                `;
            }
        }

        // Form submit handler
        document.getElementById('trackingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const trackingNumber = document.getElementById('trackingNumber').value.trim();
            if (trackingNumber) {
                trackShipment(trackingNumber);
            }
        });

        // Check URL params for tracking number
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const trackingNumber = params.get('tracking') || params.get('sendungsnummer');

            if (trackingNumber) {
                trackShipment(trackingNumber);
            }

            // Load user's shipments
            loadMyShipments();
        });
    </script>

    
    <div id="footer-placeholder"></div>


<script>window.addEventListener('load', () => lucide.createIcons());</script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
</body>
</html>
