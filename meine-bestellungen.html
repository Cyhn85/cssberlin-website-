<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bestellungen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="footer-v3.css">
    <link rel="stylesheet" href="gradient-button.css">

    <script src="api-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .page-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 240px 1fr;
            gap: 40px;
        }

        @media (max-width: 768px) {
            .page-container {
                grid-template-columns: 1fr;
            }
        }

        .sidebar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar h3 {
            margin-top: 0;
            font-family: 'Montserrat';
            font-size: 18px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }

        .sidebar-links a {
            display: block;
            padding: 12px 0;
            color: #555;
            text-decoration: none;
            border-bottom: 1px solid #f9f9f9;
        }

        .sidebar-links a:hover,
        .sidebar-links a.active {
            color: #2D5016;
            font-weight: 600;
            padding-left: 5px;
        }

        .main-content {
            background: white;
            border-radius: 12px;
            padding: 40px;
            min-height: 500px;
        }

        .main-content h1 {
            margin-top: 0;
            font-family: 'Montserrat';
            color: #2D5016;
        }

        .profile-header {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 40px;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #f0f0f0;
        }
    </style>
</head>

<body>
    <div id="header-placeholder"></div>

    <div class="page-container">
        <aside class="sidebar">
            <h3>Mein Konto</h3>
            <div class="sidebar-links">
                <a href="mein-profil.html">Mein Profil</a>
                <a href="geldbeutel.html">Geldbeutel</a>
                <a href="meine-bestellungen.html" class="active">Meine Bestellungen</a>
                <a href="meine-einstellungen.html">Einstellungen</a>
                <a href="freunde-einladen.html">Freunde einladen</a>
                <a href="spenden.html">Spenden</a>
            </div>
        </aside>

        <main class="main-content">
            <h1>Meine Bestellungen</h1>
            
            <div class="order-card" style="border:1px solid #eee; border-radius:8px; padding:20px; margin-bottom:20px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #eee; padding-bottom:10px;">
                    <div><strong>Bestellung #8492</strong><br><span style="color:#666; font-size:13px;">05.02.2026</span></div>
                    <div style="color:green; font-weight:600;">Unterwegs 🚚</div>
                </div>
                <div style="display:flex; gap:15px;">
                    <div style="width:60px; height:60px; background:#eee; border-radius:4px;"></div>
                    <div>
                        <strong>Vintage Jeans Levi's</strong><br>
                        35,00 €
                    </div>
                </div>
            </div>
        
    </main>
    </div>

    <div id="footer-placeholder"></div>

    <script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script src="user-menu.js"></script>

    <script>
        window.addEventListener('load', async function () {
            if (window.Clerk) {
                await window.Clerk.load();
                const user = window.Clerk.user;
                if (user) {
                    const header = document.getElementById('profileHeader');
                    header.innerHTML = `
                        <img src="${user.imageUrl}" class="profile-avatar">
                        <div>
                            <h2 style="margin:0;">${user.fullName || user.username}</h2> 
                            <p style="margin:5px 0; color:#666;">Mitglied seit ${new Date(user.createdAt).getFullYear()}</p>
                            <p style="margin:0; color:#2D5016;">Verifizierter Nutzer ✅</p>
                        </div>
                    `;
                }
            }
        });
    </script>
    <script src="toast.js"></script>
    <script src="message-modal.js"></script>
</body>

</html>
