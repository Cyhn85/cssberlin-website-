<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Error Logs | CSS Berlin Watchtower</title>
    <link rel="stylesheet" href="styles.css">
    <!-- API Configuration -->
    <script src="api-config.js"></script>
    <style>
        :root {
            --bg-dark: #1a1a2e;
            --bg-card: #16213e;
            --accent-red: #e94560;
            --accent-orange: #f39c12;
            --accent-green: #27ae60;
            --accent-blue: #3498db;
            --text-primary: #eee;
            --text-secondary: #aaa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .admin-header {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 24px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .admin-header h1 svg {
            color: var(--accent-red);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--accent-blue);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-danger {
            background: var(--accent-red);
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 30px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card h3 {
            font-size: 13px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
        }

        .stat-card.errors .value { color: var(--accent-red); }
        .stat-card.warnings .value { color: var(--accent-orange); }
        .stat-card.success .value { color: var(--accent-green); }
        .stat-card.info .value { color: var(--accent-blue); }

        /* Error Log Table */
        .log-section {
            background: var(--bg-card);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
        }

        .log-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .log-header h2 {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .log-filters {
            display: flex;
            gap: 12px;
        }

        .filter-select {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
        }

        .log-table th {
            text-align: left;
            padding: 14px 20px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .log-table td {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            font-size: 14px;
            vertical-align: top;
        }

        .log-table tr:hover {
            background: rgba(255,255,255,0.02);
        }

        .error-type {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .error-type.error { background: rgba(233, 69, 96, 0.2); color: var(--accent-red); }
        .error-type.promise_rejection { background: rgba(243, 156, 18, 0.2); color: var(--accent-orange); }
        .error-type.manual { background: rgba(52, 152, 219, 0.2); color: var(--accent-blue); }

        .error-message {
            max-width: 400px;
            word-break: break-word;
        }

        .error-source {
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .error-id {
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-blue);
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
        }

        /* Loading & Empty States */
        .loading, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading svg {
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Local Storage Section */
        .local-logs {
            margin-top: 30px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 16px;
                padding: 16px;
            }

            .container {
                padding: 16px;
            }

            .log-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            CSS Berlin Watchtower - Error Monitoring
        </h1>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="loadErrors()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"></path>
                    <path d="M1 20v-6h6"></path>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
                Aktualisieren
            </button>
            <button class="btn btn-primary" onclick="exportLocalLogs()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Export Logs
            </button>
            <a href="index.html" class="btn btn-secondary">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                </svg>
                Zur Startseite
            </a>
        </div>
    </header>

    <div class="container">
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card errors">
                <h3>Fehler Heute</h3>
                <div class="value" id="errorsToday">-</div>
            </div>
            <div class="stat-card warnings">
                <h3>Log-Datei Groesse</h3>
                <div class="value" id="logFileSize">-</div>
            </div>
            <div class="stat-card info">
                <h3>Lokale Logs</h3>
                <div class="value" id="localLogCount">-</div>
            </div>
            <div class="stat-card success">
                <h3>Backend Status</h3>
                <div class="value" id="backendStatus">-</div>
            </div>
        </div>

        <!-- Backend Errors -->
        <div class="log-section">
            <div class="log-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="3" y1="9" x2="21" y2="9"></line>
                    </svg>
                    Backend Error Logs
                </h2>
                <div class="log-filters">
                    <select class="filter-select" id="limitSelect" onchange="loadErrors()">
                        <option value="20">Letzte 20</option>
                        <option value="50">Letzte 50</option>
                        <option value="100">Letzte 100</option>
                    </select>
                </div>
            </div>
            <div id="backendLogs">
                <div class="loading">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="2" x2="12" y2="6"></line>
                        <line x1="12" y1="18" x2="12" y2="22"></line>
                        <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
                        <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
                        <line x1="2" y1="12" x2="6" y2="12"></line>
                        <line x1="18" y1="12" x2="22" y2="12"></line>
                        <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
                        <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
                    </svg>
                    <p>Lade Backend-Logs...</p>
                </div>
            </div>
        </div>

        <!-- Local Storage Errors -->
        <div class="log-section local-logs">
            <div class="log-header">
                <h2>
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    Local Storage Logs (Browser)
                </h2>
                <button class="btn btn-danger" onclick="clearLocalLogs()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    Loeschen
                </button>
            </div>
            <div id="localLogs">
                <div class="loading">Lade lokale Logs...</div>
            </div>
        </div>
    </div>

    <script>
        // Get API base URL
        function getApiBase() {
            if (typeof window.API_BASE !== 'undefined') {
                return window.API_BASE;
            }
            if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                return 'http://localhost:8000';
            }
            return 'https://api.cssberlin.de';
        }

        // Load stats and errors
        async function loadErrors() {
            const limit = document.getElementById('limitSelect').value;

            // Load stats
            try {
                const statsRes = await fetch(`${getApiBase()}/api/errors/stats`);
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('errorsToday').textContent = stats.total_errors_today || 0;
                    document.getElementById('logFileSize').textContent = stats.log_file_size_kb ? `${stats.log_file_size_kb} KB` : '0 KB';
                    document.getElementById('backendStatus').textContent = 'Online';
                    document.getElementById('backendStatus').style.color = '#27ae60';
                }
            } catch (e) {
                document.getElementById('backendStatus').textContent = 'Offline';
                document.getElementById('backendStatus').style.color = '#e94560';
            }

            // Load backend errors
            try {
                const errorsRes = await fetch(`${getApiBase()}/api/errors/recent?limit=${limit}`);
                if (errorsRes.ok) {
                    const data = await errorsRes.json();
                    renderBackendLogs(data.errors || []);
                } else {
                    document.getElementById('backendLogs').innerHTML = '<div class="empty-state">Backend nicht erreichbar</div>';
                }
            } catch (e) {
                document.getElementById('backendLogs').innerHTML = `<div class="empty-state">Fehler: ${e.message}</div>`;
            }

            // Load local logs
            loadLocalLogs();
        }

        // Render backend logs
        function renderBackendLogs(errors) {
            if (errors.length === 0) {
                document.getElementById('backendLogs').innerHTML = '<div class="empty-state">Keine Fehler gefunden</div>';
                return;
            }

            let html = `
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>Error ID</th>
                            <th>Typ</th>
                            <th>Nachricht</th>
                            <th>Quelle</th>
                            <th>Zeitstempel</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            errors.forEach(err => {
                const typeClass = err.type || 'error';
                html += `
                    <tr>
                        <td class="error-id">${err.error_id || '-'}</td>
                        <td><span class="error-type ${typeClass}">${err.type || 'unknown'}</span></td>
                        <td class="error-message">${escapeHtml(err.message || '-')}</td>
                        <td class="error-source">${err.source ? `${err.source}:${err.line || '?'}` : '-'}</td>
                        <td class="timestamp">${formatTimestamp(err.timestamp)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('backendLogs').innerHTML = html;
        }

        // Load local storage logs
        function loadLocalLogs() {
            const STORAGE_KEY = 'cssberlin_error_logs';
            let logs = [];

            try {
                logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (e) {
                logs = [];
            }

            document.getElementById('localLogCount').textContent = logs.length;

            if (logs.length === 0) {
                document.getElementById('localLogs').innerHTML = '<div class="empty-state">Keine lokalen Logs</div>';
                return;
            }

            // Reverse to show newest first
            logs = logs.slice().reverse();

            let html = `
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>Typ</th>
                            <th>Nachricht</th>
                            <th>URL</th>
                            <th>Zeitstempel</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            logs.forEach(err => {
                const typeClass = err.type || 'error';
                html += `
                    <tr>
                        <td><span class="error-type ${typeClass}">${err.type || 'unknown'}</span></td>
                        <td class="error-message">${escapeHtml(err.message || '-')}</td>
                        <td class="error-source">${err.url ? new URL(err.url).pathname : '-'}</td>
                        <td class="timestamp">${formatTimestamp(err.timestamp)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('localLogs').innerHTML = html;
        }

        // Clear local logs
        function clearLocalLogs() {
            if (confirm('Alle lokalen Logs loeschen?')) {
                localStorage.removeItem('cssberlin_error_logs');
                loadLocalLogs();
            }
        }

        // Export local logs
        function exportLocalLogs() {
            const STORAGE_KEY = 'cssberlin_error_logs';
            let logs = [];

            try {
                logs = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            } catch (e) {
                logs = [];
            }

            const blob = new Blob([JSON.stringify(logs, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `cssberlin_errors_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Helper: Escape HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Helper: Format timestamp
        function formatTimestamp(ts) {
            if (!ts) return '-';
            try {
                const date = new Date(ts);
                return date.toLocaleString('de-DE', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            } catch (e) {
                return ts;
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', loadErrors);

        // Auto-refresh every 30 seconds
        setInterval(loadErrors, 30000);
    </script>
</body>
</html>
