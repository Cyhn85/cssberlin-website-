<!DOCTYPE html>
<html lang="de">

<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Verhandlungen - CSS Berlin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Standard Styles -->
    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    
    <link rel="stylesheet" href="product-card-glass.css">
    <link rel="stylesheet" href="footer-v3.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f5f5;
            color: #111827;
            min-height: 100vh;
        }

        /* Pazarlik Specific Styles */
        .pazarlik-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .page-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 32px;
            font-weight: 800;
            color: #111827;
        }

        .page-stats {
            display: flex;
            gap: 30px;
            background: white;
            padding: 12px 24px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-family: 'Montserrat', sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: #2D5016;
        }

        .stat-label {
            font-size: 11px;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        /* Filter Tabs */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 16px;
            overflow-x: auto;
        }

        .filter-tab {
            padding: 10px 20px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            color: #4b5563;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-tab:hover {
            border-color: #2D5016;
            color: #2D5016;
        }

        .filter-tab.active {
            background: #2D5016;
            color: white;
            border-color: #2D5016;
        }

        .filter-tab .count {
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            color: #4b5563;
        }

        .filter-tab.active .count {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Grid */
        .negotiations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 24px;
        }

        /* Card Styles */
        .negotiation-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e5e7eb;
            overflow: hidden;
            transition: all 0.3s;
        }

        .negotiation-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .card-product {
            padding: 20px;
            display: flex;
            gap: 16px;
            border-bottom: 1px solid #f3f4f6;
        }

        .card-product-image {
            width: 80px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            background: #f3f4f6;
        }

        .card-product-info {
            flex: 1;
            min-width: 0;
        }

        .card-product-title {
            font-weight: 600;
            color: #111827;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-product-brand {
            font-size: 12px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-product-price {
            font-weight: 700;
            color: #2D5016;
            font-size: 18px;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-badge.pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .status-badge.accepted {
            background: #f0fdf4;
            color: #15803d;
        }

        .status-badge.rejected {
            background: #fef2f2;
            color: #b91c1c;
        }

        .offer-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 20px;
            font-size: 14px;
            color: #4b5563;
        }

        .offer-value {
            font-weight: 600;
            color: #111827;
        }

        .card-actions {
            padding: 20px;
            border-top: 1px solid #f3f4f6;
            display: flex;
            gap: 10px;
        }

        .card-btn {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            text-align: center;
        }

        .card-btn.primary {
            background: #2D5016;
            color: white;
        }

        .card-btn.secondary {
            background: #f3f4f6;
            color: #374151;
        }

        /* Modal */
        .counter-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .counter-modal.show {
            display: flex;
        }

        .counter-modal-content {
            background: white;
            width: 100%;
            max-width: 480px;
            border-radius: 16px;
            overflow: hidden;
        }

        .counter-modal-header {
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .counter-modal-body {
            padding: 24px;
        }

        .counter-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 16px;
            font-family: inherit;
        }

        @media (max-width: 768px) {
            .page-stats {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- HEADER V3 (Standard) -->
    
    </div>

    
    
    <div id="header-placeholder"></div>



    <div class="pazarlik-container">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-title">Meine Verhandlungen</h1>
            <div class="page-stats">
                <div class="stat-item">
                    <div class="stat-value" id="activeCount">0</div>
                    <div class="stat-label">Aktiv</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="acceptedCount">0</div>
                    <div class="stat-label">Angenommen</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="savedAmount">0€</div>
                    <div class="stat-label">Gespart</div>
                </div>
            </div>
        </div>

        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">Alle <span class="count" id="allCount">0</span></button>
            <button class="filter-tab" data-filter="pending">Ausstehend <span class="count"
                    id="pendingCount">0</span></button>
            <button class="filter-tab" data-filter="countered">Gegenangebot <span class="count"
                    id="counteredCount">0</span></button>
            <button class="filter-tab" data-filter="accepted">Angenommen <span class="count"
                    id="acceptedFilterCount">0</span></button>
            <button class="filter-tab" data-filter="rejected">Abgelehnt <span class="count"
                    id="rejectedCount">0</span></button>
        </div>

        <!-- Negotiations Grid -->
        <div class="negotiations-grid" id="negotiationsGrid">
            <!-- Cards will be inserted here -->
        </div>

        <!-- Empty State -->
        <div class="empty-state" id="emptyState" style="display: none; padding:60px 20px; text-align:center;">
            <div style="font-size:48px; margin-bottom:16px;">💬</div>
            <h3 style="font-size:20px; font-weight:700; margin-bottom:8px;">Keine Verhandlungen</h3>
            <p style="color:#666; margin-bottom:24px;">Starten Sie Verhandlungen für Produkte, die Ihnen gefallen.</p>
            <a href="index.html" class="card-btn primary"
                style="display:inline-block; width:auto; text-decoration:none;">Produkte entdecken</a>
        </div>
    </div>

    <!-- Counter Modal (Preserved Structure) -->
    <div class="counter-modal" id="counterModal">
        <div class="counter-modal-content">
            <div class="counter-modal-header">
                <h3 style="font-weight:700;">Gegenangebot senden</h3>
                <button class="counter-modal-close" onclick="closeCounterModal()"
                    style="background:none; border:none; font-size:24px; cursor:pointer;">&times;</button>
            </div>
            <div class="counter-modal-body">
                <div style="margin-bottom:16px;">
                    <label style="display:block; margin-bottom:8px; font-weight:600;">Ihr Gegenangebot (€)</label>
                    <input type="number" class="counter-input" id="counterOfferInput" placeholder="Preis eingeben">
                </div>
                <div>
                    <label style="display:block; margin-bottom:8px; font-weight:600;">Nachricht (optional)</label>
                    <input type="text" class="counter-input" id="counterMessageInput" placeholder="Nachricht...">
                </div>
            </div>
            <div class="counter-modal-actions"
                style="padding:20px; display:flex; gap:10px; border-top:1px solid #e5e7eb;">
                <button class="card-btn secondary" onclick="closeCounterModal()">Abbrechen</button>
                <button class="card-btn primary" onclick="submitCounterOffer()">Senden</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    
    
    <div id="footer-placeholder"></div>



    <script src="auth-modal-v3.js"></script>
    <script src="api-client.js"></script>
    <script src="auth-gate.js"></script>
    <script src="auth-guard.js"></script>
    <script src="pazarlik.js"></script>
    <script src="guest-mode.js"></script>
    <script>
        lucide.createIcons();
    </script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script src="toast.js"></script>
</body>

</html>
