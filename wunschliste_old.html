<!DOCTYPE html>
<html lang="de">
<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wunschliste - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="footer-v3.css">
    <link rel="stylesheet" href="gradient-button.css">
    
    <!-- CLERK AUTH -->
    <script async crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c3VwZXItd2FzcC04NS5jbGVyay5hY2NvdW50cy5kZXYk"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript"></script>
    
    <script src="api-config.js"></script>
    <script src="auth-modal-v3.js"></script>

</head>
<body>
    <!-- Header -->
    
    
    <div id="header-placeholder"></div>



    <!-- Page Header -->
    <div style="background: linear-gradient(135deg, #2D5016, #4A7C2C); color: white; padding: 48px 0;">
        <div style="max-width: 1400px; margin: 0 auto; padding: 0 32px;">
            <h1 style="font-size: 48px; font-weight: 700; margin-bottom: 16px;">Meine Wunschliste</h1>
            <p style="font-size: 18px; opacity: 0.9;">Hier findest du alle deine gespeicherten Favoriten</p>
        </div>
    </div>

    <!-- Wishlist Content -->
    <section style="max-width: 1400px; margin: 60px auto; padding: 0 32px;">
        <div id="wishlistEmpty" style="display: none; text-align: center; padding: 80px 32px;">
            <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#ccc" stroke-width="1" style="margin: 0 auto 24px;">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            <h2 style="font-size: 28px; font-weight: 600; color: #212121; margin-bottom: 16px;">Deine Wunschliste ist leer</h2>
            <p style="font-size: 16px; color: #666; margin-bottom: 32px;">Speichere Artikel, die dir gefallen, indem du auf das Herz-Symbol klickst</p>
            <a href="index.html" style="display: inline-block; background: linear-gradient(135deg, #2D5016, #4A7C2C); color: white; padding: 16px 48px; border-radius: 12px; text-decoration: none; font-weight: 600; font-size: 16px;">
                Jetzt Shoppen
            </a>
        </div>

        <div id="wishlistContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
                <h2 style="font-size: 24px; font-weight: 600; color: #212121;">
                    <span id="wishlistItemCount">0</span> Artikel
                </h2>
                <button id="clearWishlistBtn" style="background: transparent; border: 2px solid #FF4444; color: #FF4444; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.3s;">
                    Alle entfernen
                </button>
            </div>

            <div class="products-grid" id="wishlistGrid">
                <!-- Wishlist products will be loaded here by JavaScript -->
            </div>
        </div>
    </section>

    <!-- Footer -->
    
    
    <div id="footer-placeholder"></div>



    <script src="script.js"></script>
    <script>
        // Load wishlist items on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadWishlistPage();

            // Clear wishlist button
            document.getElementById('clearWishlistBtn')?.addEventListener('click', function() {
                if (confirm('Möchtest du wirklich alle Artikel aus deiner Wunschliste entfernen?')) {
                    localStorage.removeItem('wishlist');
                    loadWishlistPage();
                    updateWishlistCount();
                }
            });
        });

        function loadWishlistPage() {
            const wishlist = JSON.parse(localStorage.getItem('wishlist') || '[]');
            const wishlistEmpty = document.getElementById('wishlistEmpty');
            const wishlistContent = document.getElementById('wishlistContent');
            const wishlistGrid = document.getElementById('wishlistGrid');
            const wishlistItemCount = document.getElementById('wishlistItemCount');

            if (wishlist.length === 0) {
                wishlistEmpty.style.display = 'block';
                wishlistContent.style.display = 'none';
            } else {
                wishlistEmpty.style.display = 'none';
                wishlistContent.style.display = 'block';
                wishlistItemCount.textContent = wishlist.length;

                // Generate product cards for wishlist items
                wishlistGrid.innerHTML = wishlist.map(productId => {
                    // In a real app, you'd fetch product data by ID
                    // For now, we'll create sample cards
                    return `
                        <div class="product-card" data-product-id="${productId}">
                            <div class="product-image-container">
                                <img src="https://picsum.photos/400/500?random=${productId}" alt="Product">
                                <button class="wishlist-btn active" onclick="toggleWishlist(event, ${productId})">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor">
                                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                                    </svg>
                                </button>
                                <div class="product-badges">
                                    <span class="badge badge-new">Neu</span>
                                    <span class="badge badge-co2">-${Math.floor(Math.random() * 10 + 2)} kg CO₂</span>
                                </div>
                            </div>
                            <div class="product-info">
                                <div class="product-brand">Premium Brand ${productId}</div>
                                <h3 class="product-title">Stylisches Produkt ${productId}</h3>
                                <div class="product-meta">
                                    <span class="product-size">Größe M</span>
                                    <span class="product-condition">Sehr gut</span>
                                </div>
                                <div class="product-footer">
                                    <div class="product-price">
                                        <span class="price-current">${(Math.random() * 50 + 20).toFixed(2)} €</span>
                                        <span class="price-original">${(Math.random() * 100 + 50).toFixed(2)} €</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');

                // Make cards clickable
                document.querySelectorAll('.product-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('.wishlist-btn')) {
                            return;
                        }
                        window.location.href = 'product.html';
                    });
                    card.style.cursor = 'pointer';
                });
            }
        }
    </script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
</body>
</html>
