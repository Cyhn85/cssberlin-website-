<!DOCTYPE html>
<html lang="de">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Bestellungen - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="toast.css">
    <style>
        .orders-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 28px;
            color: #333;
            margin: 0 0 10px;
        }

        .page-header p {
            color: #666;
            font-size: 15px;
            margin: 0;
        }

        /* Tabs */
        .order-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .order-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            position: relative;
        }

        .order-tab:hover {
            color: #333;
            background: #f5f5f5;
        }

        .order-tab.active {
            color: #2D5016;
            background: #E8F5E9;
        }

        .order-tab.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            right: 0;
            height: 3px;
            background: #2D5016;
            border-radius: 3px 3px 0 0;
        }

        .tab-count {
            display: inline-block;
            background: #e0e0e0;
            color: #666;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .order-tab.active .tab-count {
            background: #2D5016;
            color: white;
        }

        /* Order Cards */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: #fafafa;
            border-bottom: 1px solid #f0f0f0;
        }

        .order-info {
            display: flex;
            gap: 30px;
        }

        .order-info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .order-info-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
        }

        .order-info-value {
            font-weight: 600;
            color: #333;
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .status-pending {
            background: #FFF3E0;
            color: #E65100;
        }

        .status-paid {
            background: #E3F2FD;
            color: #1565C0;
        }

        .status-shipped {
            background: #E8F5E9;
            color: #2E7D32;
        }

        .status-delivered {
            background: #E8F5E9;
            color: #1B5E20;
        }

        .status-cancelled {
            background: #FFEBEE;
            color: #C62828;
        }

        /* Order Items */
        .order-card-body {
            padding: 20px 25px;
        }

        .order-items-preview {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .order-item-thumb {
            width: 80px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
        }

        .order-item-info {
            flex: 1;
        }

        .order-item-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .order-item-meta {
            font-size: 13px;
            color: #666;
        }

        .order-item-price {
            font-size: 18px;
            font-weight: 700;
            color: #2D5016;
        }

        .more-items {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 100px;
            background: #f5f5f5;
            border-radius: 8px;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }

        /* Tracking Section */
        .tracking-section {
            background: #f9f9f9;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .tracking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .tracking-header h4 {
            margin: 0;
            font-size: 14px;
            color: #333;
        }

        .tracking-number {
            font-family: monospace;
            background: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #2D5016;
            border: 1px solid #e0e0e0;
        }

        .tracking-timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
        }

        .tracking-timeline::before {
            content: '';
            position: absolute;
            top: 12px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: #e0e0e0;
        }

        .tracking-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .tracking-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tracking-dot.active {
            background: #2D5016;
        }

        .tracking-dot.active svg {
            color: white;
        }

        .tracking-dot svg {
            width: 14px;
            height: 14px;
            color: #999;
        }

        .tracking-label {
            font-size: 11px;
            color: #666;
            text-align: center;
            max-width: 70px;
        }

        .tracking-step.active .tracking-label {
            color: #2D5016;
            font-weight: 600;
        }

        /* Action Buttons */
        .order-card-footer {
            display: flex;
            gap: 10px;
            padding: 15px 25px;
            border-top: 1px solid #f0f0f0;
            flex-wrap: wrap;
        }

        .order-btn {
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s;
            cursor: pointer;
            border: none;
        }

        .order-btn-primary {
            background: #2D5016;
            color: white;
        }

        .order-btn-primary:hover {
            background: #1F3A0E;
        }

        .order-btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .order-btn-secondary:hover {
            background: #e0e0e0;
        }

        .order-btn-danger {
            background: #FFEBEE;
            color: #C62828;
        }

        .order-btn-danger:hover {
            background: #FFCDD2;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #666;
            margin-bottom: 20px;
        }

        /* Tracking Modal */
        .tracking-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }

        .tracking-modal.show {
            display: flex;
        }

        .tracking-modal-content {
            background: white;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .tracking-modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .tracking-modal-header h3 {
            margin: 0;
        }

        .tracking-modal-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .tracking-modal-body {
            padding: 25px;
        }

        .tracking-detail-item {
            display: flex;
            gap: 15px;
            padding: 15px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .tracking-detail-item:last-child {
            border-bottom: none;
        }

        .tracking-detail-icon {
            width: 40px;
            height: 40px;
            background: #E8F5E9;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tracking-detail-icon svg {
            width: 20px;
            height: 20px;
            color: #2D5016;
        }

        .tracking-detail-content h4 {
            margin: 0 0 5px;
            font-size: 15px;
        }

        .tracking-detail-content p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }

        .tracking-detail-time {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .order-info {
                flex-direction: column;
                gap: 10px;
            }

            .order-card-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .tracking-timeline {
                flex-direction: column;
                gap: 15px;
            }

            .tracking-timeline::before {
                display: none;
            }

            .tracking-step {
                flex-direction: row;
                gap: 15px;
            }

            .tracking-label {
                max-width: none;
                text-align: left;
            }

            .order-tabs {
                overflow-x: auto;
                flex-wrap: nowrap;
            }

            .order-tab {
                white-space: nowrap;
            }
        }
    </style>

    <div class="orders-container">
        <div class="page-header">
            <h1>Meine Bestellungen</h1>
            <p>Verfolgen Sie den Status Ihrer Bestellungen und verwalten Sie Ihre Käufe</p>
        </div>

        <!-- Tabs -->
        <div class="order-tabs">
            <button class="order-tab active" data-status="all">
                Alle <span class="tab-count" id="countAll">0</span>
            </button>
            <button class="order-tab" data-status="pending_payment">
                Zahlung ausstehend <span class="tab-count" id="countPending">0</span>
            </button>
            <button class="order-tab" data-status="paid">
                Bezahlt <span class="tab-count" id="countPaid">0</span>
            </button>

    <!-- Tracking Modal -->
    <div class="tracking-modal" id="trackingModal">
        <div class="tracking-modal-content">
            <div class="tracking-modal-header">
                <h3>Sendungsverfolgung</h3>
                <button class="tracking-modal-close" onclick="closeTrackingModal()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

    <script>
        let allOrders = [];
        let currentFilter = 'all';

        // Initialize page
        async function init() {
            await authGate.checkAuthStatus();

            if (!authGate.isAuthenticated) {
                authGate.showLoginModal('Bestellungen anzeigen', 'bestellungen.html');
                return;
            }

            loadOrders();
            setupTabs();
        }

        function loadOrders() {
            allOrders = JSON.parse(localStorage.getItem('cssberlin_orders') || '[]');

            // For demo, add some sample orders if empty
            if (allOrders.length === 0) {
                addSampleOrders();
            }

            updateCounts();
            renderOrders();
        }

        function addSampleOrders() {
            const sampleOrders = [
                {
                    id: 'ORD-1703847234567',
                    items: [
                        { name: 'Vintage Levi\'s Jeans', price: '45,00€', size: '32', image: 'https://images.unsplash.com/photo-1542272604-787c3835535d?w=200' }
                    ],
                    subtotal: 45,
                    shipping: 4.99,
                    total: 49.99,
                    paymentMethod: 'paypal',
                    shippingMethod: 'dhl',
                    shippingAddress: { firstName: 'Max', lastName: 'Mustermann', street: 'Musterstr. 123', postalCode: '10115', city: 'Berlin' },
                    status: 'shipped',
                    trackingNumber: 'JJD000390021231234567',
                    createdAt: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString()
                },
                {
                    id: 'ORD-1703756234567',
                    items: [
                        { name: 'Nike Air Max 90', price: '65,00€', size: '42', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200' },
                        { name: 'Adidas Hoodie', price: '35,00€', size: 'L', image: 'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=200' }
                    ],
                    subtotal: 100,
                    shipping: 4.99,
                    total: 104.99,
                    paymentMethod: 'card',
                    shippingMethod: 'hermes',
                    shippingAddress: { firstName: 'Max', lastName: 'Mustermann', street: 'Musterstr. 123', postalCode: '10115', city: 'Berlin' },
                    status: 'delivered',
                    trackingNumber: 'H1234567890123',
                    createdAt: new Date(Date.now() - 10 * 24 * 60 * 60 * 1000).toISOString()
                }
            ];

            allOrders = sampleOrders;
            localStorage.setItem('cssberlin_orders', JSON.stringify(allOrders));
        }

        function setupTabs() {
            document.querySelectorAll('.order-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.status;
                    renderOrders();
                });
            });
        }

        function updateCounts() {
            document.getElementById('countAll').textContent = allOrders.length;
            document.getElementById('countPending').textContent = allOrders.filter(o => o.status === 'pending_payment').length;
            document.getElementById('countPaid').textContent = allOrders.filter(o => o.status === 'paid').length;
            document.getElementById('countShipped').textContent = allOrders.filter(o => o.status === 'shipped').length;
            document.getElementById('countDelivered').textContent = allOrders.filter(o => o.status === 'delivered').length;
        }

        function renderOrders() {
            const container = document.getElementById('ordersList');
            let filteredOrders = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);

            if (filteredOrders.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <h3>Keine Bestellungen</h3>
                        <p>Sie haben noch keine Bestellungen in dieser Kategorie.</p>
                        <a href="index.html" class="order-btn order-btn-primary">Jetzt einkaufen</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredOrders.map(order => renderOrderCard(order)).join('');
        }

        function renderOrderCard(order) {
            const statusInfo = getStatusInfo(order.status);
            const date = new Date(order.createdAt).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });

            const itemsPreview = order.items.slice(0, 2).map(item => `
                <div style="display: flex; gap: 15px;">
                    <img src="${item.image}" alt="${item.name}" class="order-item-thumb" onerror="this.src='https://via.placeholder.com/80x100?text=Bild'">
                    <div class="order-item-info">
                        <div class="order-item-name">${item.name}</div>
                        <div class="order-item-meta">Größe: ${item.size}</div>
                        <div class="order-item-price">${item.price}</div>
                    </div>
                </div>
            `).join('');

            const moreItems = order.items.length > 2 ? `<div class="more-items">+${order.items.length - 2} mehr</div>` : '';

            const trackingHtml = order.trackingNumber ? `
                <div class="tracking-section">
                    <div class="tracking-header">
                        <h4>Sendungsverfolgung</h4>
                        <span class="tracking-number">${order.trackingNumber}</span>
                    </div>
                    <div class="tracking-timeline">
                        ${renderTrackingSteps(order.status)}
                    </div>
                </div>
            ` : '';

            const actionButtons = getActionButtons(order);

            return `
                <div class="order-card">
                    <div class="order-card-header">
                        <div class="order-info">
                            <div class="order-info-item">
                                <span class="order-info-label">Bestellnummer</span>
                                <span class="order-info-value">${order.id}</span>
                            </div>
                            <div class="order-info-item">
                                <span class="order-info-label">Bestellt am</span>
                                <span class="order-info-value">${date}</span>
                            </div>
                            <div class="order-info-item">
                                <span class="order-info-label">Gesamtbetrag</span>
                                <span class="order-info-value">${order.total.toFixed(2).replace('.', ',')}€</span>
                            </div>
                        </div>
                        <span class="status-badge ${statusInfo.class}">
                            ${statusInfo.icon}
                            ${statusInfo.text}
                        </span>
                    </div>
                    <div class="order-card-body">
                        <div class="order-items-preview">
                            ${itemsPreview}
                            ${moreItems}
                        </div>
                        ${trackingHtml}
                    </div>
                    <div class="order-card-footer">
                        ${actionButtons}
                    </div>
                </div>
            `;
        }

        function getStatusInfo(status) {
            const statuses = {
                'pending_payment': {
                    text: 'Zahlung ausstehend',
                    class: 'status-pending',
                    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>'
                },
                'paid': {
                    text: 'Bezahlt',
                    class: 'status-paid',
                    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>'
                },
                'shipped': {
                    text: 'Versendet',
                    class: 'status-shipped',
                    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>'
                },
                'delivered': {
                    text: 'Geliefert',
                    class: 'status-delivered',
                    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                },
                'cancelled': {
                    text: 'Storniert',
                    class: 'status-cancelled',
                    icon: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'
                }
            };
            return statuses[status] || statuses['pending_payment'];
        }

        function renderTrackingSteps(status) {
            const steps = ['pending_payment', 'paid', 'shipped', 'delivered'];
            const currentIndex = steps.indexOf(status);

            return steps.map((step, index) => {
                const isActive = index <= currentIndex;
                const icons = {
                    'pending_payment': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>',
                    'paid': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>',
                    'shipped': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>',
                    'delivered': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>'
                };
                const labels = {
                    'pending_payment': 'Zahlung',
                    'paid': 'Bezahlt',
                    'shipped': 'Versendet',
                    'delivered': 'Geliefert'
                };

                return `
                    <div class="tracking-step ${isActive ? 'active' : ''}">
                        <div class="tracking-dot ${isActive ? 'active' : ''}">
                            ${icons[step]}
                        </div>
                        <span class="tracking-label">${labels[step]}</span>
                    </div>
                `;
            }).join('');
        }

        function getActionButtons(order) {
            let buttons = [];

            if (order.trackingNumber) {
                buttons.push(`<button class="order-btn order-btn-primary" onclick="openTrackingModal('${order.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    Tracking
                </button>`);
            }

            if (order.status === 'shipped') {
                buttons.push(`<button class="order-btn order-btn-primary" onclick="confirmDelivery('${order.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    Empfang bestätigen
                </button>`);
            }

            if (order.status === 'pending_payment') {
                buttons.push(`<button class="order-btn order-btn-primary" onclick="retryPayment('${order.id}')">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                        <line x1="1" y1="10" x2="23" y2="10"></line>
                    </svg>
                    Jetzt bezahlen
                </button>`);
                buttons.push(`<button class="order-btn order-btn-danger" onclick="cancelOrder('${order.id}')">Stornieren</button>`);
            }

            buttons.push(`<button class="order-btn order-btn-secondary" onclick="contactSeller('${order.id}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                </svg>
                Verkäufer kontaktieren
            </button>`);

            return buttons.join('');
        }

        function openTrackingModal(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order || !order.trackingNumber) return;

            const carrierLinks = {
                'dhl': `https://www.dhl.de/de/privatkunden/pakete-empfangen/verfolgen.html?piececode=${order.trackingNumber}`,
                'hermes': `https://www.myhermes.de/empfangen/sendungsverfolgung/sendungsinformation/#${order.trackingNumber}`
            };

            const body = document.getElementById('trackingModalBody');
            body.innerHTML = `
                <div style="text-align: center; margin-bottom: 25px;">
                    <div style="font-size: 14px; color: #666; margin-bottom: 8px;">Sendungsnummer</div>
                    <div style="font-family: monospace; font-size: 18px; font-weight: 600; color: #2D5016;">${order.trackingNumber}</div>
                </div>
                <div class="tracking-detail-item">
                    <div class="tracking-detail-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="1" y="3" width="15" height="13"></rect>
                            <polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon>
                        </svg>
                    </div>
                    <div class="tracking-detail-content">
                        <h4>Paket versendet</h4>
                        <p>Ihr Paket ist auf dem Weg zu Ihnen.</p>
                        <div class="tracking-detail-time">Vor 2 Tagen</div>
                    </div>
                </div>
                <div class="tracking-detail-item">
                    <div class="tracking-detail-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                            <circle cx="12" cy="10" r="3"></circle>
                        </svg>
                    </div>
                    <div class="tracking-detail-content">
                        <h4>Im Verteilzentrum</h4>
                        <p>Berlin Paketzentrum</p>
                        <div class="tracking-detail-time">Vor 1 Tag</div>
                    </div>
                </div>
                <div style="margin-top: 20px; text-align: center;">
                    <a href="${carrierLinks[order.shippingMethod] || carrierLinks['dhl']}" target="_blank" class="order-btn order-btn-primary" style="display: inline-flex;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                        Auf Carrier-Website verfolgen
                    </a>
                </div>
            `;

            document.getElementById('trackingModal').classList.add('show');
        }

        function closeTrackingModal() {
            document.getElementById('trackingModal').classList.remove('show');
        }

        function confirmDelivery(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            if (confirm('Haben Sie die Bestellung erhalten und ist alles in Ordnung?')) {
                order.status = 'delivered';
                localStorage.setItem('cssberlin_orders', JSON.stringify(allOrders));
                if (typeof toast !== 'undefined') {
                    toast.success('Danke!', 'Empfang bestätigt. Die Zahlung wird an den Verkäufer freigegeben.', 3000);
                }
                updateCounts();
                renderOrders();
            }
        }

        function retryPayment(orderId) {
            alert('Weiterleitung zur Zahlungsseite...');
        }

        function cancelOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            if (confirm('Möchten Sie diese Bestellung wirklich stornieren?')) {
                order.status = 'cancelled';
                localStorage.setItem('cssberlin_orders', JSON.stringify(allOrders));
                if (typeof toast !== 'undefined') {
                    toast.info('Bestellung storniert', 'Ihre Bestellung wurde erfolgreich storniert.', 3000);
                }
                updateCounts();
                renderOrders();
            }
        }

        function contactSeller(orderId) {
            window.location.href = 'messages.html?order=' + orderId;
        }

        // Close modal on outside click
        document.getElementById('trackingModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTrackingModal();
            }
        });

        // Initialize
        window.addEventListener('load', init);
    </script>

    
    <div id="footer-placeholder"></div>


<script>window.addEventListener('load', () => lucide.createIcons());</script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script src="message-modal.js"></script>
</body>
</html>
