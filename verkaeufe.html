<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meine Verkaufe - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css?v=2028">
    <link rel="stylesheet" href="header-v2.css">
    <link rel="stylesheet" href="toast.css">
    <style>
        body.page-wrapper {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main.page-main {
            flex: 1;
        }

        .sales-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 28px;
            color: #333;
            margin: 0 0 10px;
        }

        .page-header p {
            color: #666;
            font-size: 15px;
            margin: 0;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-icon.green { background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%); color: #2D5016; }
        .stat-icon.orange { background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%); color: #E65100; }
        .stat-icon.blue { background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%); color: #1565C0; }

        .stat-content h3 {
            font-size: 28px;
            font-weight: 700;
            color: #333;
            margin: 0;
        }

        .stat-content p {
            font-size: 14px;
            color: #666;
            margin: 4px 0 0;
        }

        /* Tabs */
        .sales-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .sales-tab {
            padding: 10px 20px;
            background: none;
            border: none;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            transition: all 0.3s;
            position: relative;
            white-space: nowrap;
        }

        .sales-tab:hover {
            color: #333;
            background: #f5f5f5;
        }

        .sales-tab.active {
            color: #2D5016;
            background: #E8F5E9;
        }

        .sales-tab.active::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 0;
            right: 0;
            height: 3px;
            background: #2D5016;
            border-radius: 3px 3px 0 0;
        }

        .tab-badge {
            display: inline-block;
            background: #e0e0e0;
            color: #666;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: 6px;
        }

        .sales-tab.active .tab-badge {
            background: #2D5016;
            color: white;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Product Table */
        .products-table {
            width: 100%;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .products-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .products-table th {
            background: #f9f9f9;
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .products-table td {
            padding: 16px;
            border-top: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .product-cell {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .product-cell img {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
        }

        .product-info h4 {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin: 0 0 4px;
        }

        .product-info p {
            font-size: 12px;
            color: #888;
            margin: 0;
        }

        .price-cell {
            font-weight: 700;
            color: #2D5016;
            font-size: 16px;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.active { background: #E8F5E9; color: #2D5016; }
        .status-badge.pending { background: #FFF3E0; color: #E65100; }
        .status-badge.sold { background: #E3F2FD; color: #1565C0; }
        .status-badge.cancelled { background: #FFEBEE; color: #C62828; }

        .action-btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn.primary {
            background: #2D5016;
            color: white;
        }

        .action-btn.primary:hover {
            background: #3d6b1e;
        }

        .action-btn.secondary {
            background: #f5f5f5;
            color: #333;
        }

        .action-btn.secondary:hover {
            background: #e0e0e0;
        }

        /* Appointments Section */
        .appointment-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .appointment-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .appointment-info img {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            object-fit: cover;
        }

        .appointment-details h4 {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin: 0 0 8px;
        }

        .appointment-details .date-time {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: #666;
        }

        .appointment-details .date-time svg {
            width: 16px;
            height: 16px;
        }

        .appointment-actions {
            display: flex;
            gap: 10px;
        }

        .pin-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px 24px;
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            border-radius: 12px;
        }

        .pin-display span {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .pin-display strong {
            font-size: 24px;
            font-weight: 800;
            color: #2D5016;
            letter-spacing: 4px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.08);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 20px;
            color: #333;
            margin: 0 0 10px;
        }

        .empty-state p {
            font-size: 15px;
            color: #666;
            margin: 0 0 20px;
        }

        .empty-state .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background: linear-gradient(135deg, #FF8C42 0%, #E8854C 100%);
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .empty-state .btn-primary:hover {
            background: linear-gradient(135deg, #2D5016 0%, #3d6b1e 100%);
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .products-table {
                overflow-x: auto;
            }

            .appointment-card {
                flex-direction: column;
                text-align: center;
            }

            .appointment-info {
                flex-direction: column;
            }

            .appointment-actions {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body class="page-wrapper">
    <main class="page-main">
        <!-- Header will be injected -->
        <div id="header-container"></div>

        <div class="sales-container">
            <div class="page-header">
                <h1>Meine Verkaufe</h1>
                <p>Verwalte deine aktiven Anzeigen, Termine und verkaufte Artikel</p>
            </div>

            <!-- Stats -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon green">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"></path>
                            <path d="M4 6v12c0 1.1.9 2 2 2h14v-4"></path>
                            <path d="M18 12a2 2 0 0 0-2 2c0 1.1.9 2 2 2h4v-4h-4z"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="totalEarnings">0,00</h3>
                        <p>Gesamteinnahmen</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <polyline points="12 6 12 12 16 14"></polyline>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="activeCount">0</h3>
                        <p>Aktive Anzeigen</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon blue">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                    </div>
                    <div class="stat-content">
                        <h3 id="soldCount">0</h3>
                        <p>Verkaufte Artikel</p>
                    </div>
                </div>
            </div>

            <!-- Tabs -->
            <div class="sales-tabs">
                <button class="sales-tab active" onclick="switchTab('active')">
                    Aktive Anzeigen
                    <span class="tab-badge" id="activeBadge">0</span>
                </button>
                <button class="sales-tab" onclick="switchTab('appointments')">
                    Termine
                    <span class="tab-badge" id="appointmentsBadge">0</span>
                </button>
                <button class="sales-tab" onclick="switchTab('sold')">
                    Verkauft
                    <span class="tab-badge" id="soldBadge">0</span>
                </button>
                <button class="sales-tab" onclick="switchTab('offers')">
                    Angebote
                    <span class="tab-badge" id="offersBadge">0</span>
                </button>
            </div>

            <!-- Active Products Tab -->
            <div class="tab-content active" id="activeTab">
                <div class="products-table" id="activeProducts">
                    <!-- Products will be loaded here -->
                </div>
            </div>

            <!-- Appointments Tab -->
            <div class="tab-content" id="appointmentsTab">
                <div id="appointmentsList">
                    <!-- Appointments will be loaded here -->
                </div>
            </div>

            <!-- Sold Tab -->
            <div class="tab-content" id="soldTab">
                <div class="products-table" id="soldProducts">
                    <!-- Sold products will be loaded here -->
                </div>
            </div>

            <!-- Offers Tab -->
            <div class="tab-content" id="offersTab">
                <div id="offersList">
                    <!-- Offers will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer will be injected -->
    <div id="footer-container"></div>

    <!-- Scripts -->
    <script src="api-config.js"></script>
    <script src="api-client.js"></script>
    <script src="auth-gate.js"></script>
    <script src="global-header.js"></script>
    <script src="success-animations.js"></script>
    <script src="toast.js"></script>

    <script>
        // Tab switch
        function switchTab(tabName) {
            // Deactivate all tabs
            document.querySelectorAll('.sales-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            // Activate selected tab
            document.querySelector(`[onclick="switchTab('${tabName}')"]`).classList.add('active');
            document.getElementById(tabName + 'Tab').classList.add('active');
        }

        // Load seller data
        async function loadSellerData() {
            try {
                // Check auth
                await authGate.checkAuthStatus();
                if (!authGate.isAuthenticated) {
                    window.location.href = 'login.html';
                    return;
                }

                // Load active products
                const products = await loadMyProducts();

                // Load appointments
                const appointments = await loadMyAppointments();

                // Load offers
                const offers = await loadMyOffers();

                // Update stats
                updateStats(products, appointments);

            } catch (error) {
                console.error('Error loading seller data:', error);
            }
        }

        // Load my products
        async function loadMyProducts() {
            try {
                const response = await fetch(window.API_BASE_URL + '/api/products/my', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderProducts(data.products || []);
                    return data.products || [];
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }

            // Demo data
            const demoProducts = [
                { id: 1, name: 'Vintage Jacke', price: 45.00, status: 'active', image: 'https://picsum.photos/100?1', views: 124, created_at: '2025-01-15' },
                { id: 2, name: 'Nike Sneakers', price: 89.00, status: 'active', image: 'https://picsum.photos/100?2', views: 87, created_at: '2025-01-10' },
                { id: 3, name: 'Levi\'s Jeans', price: 35.00, status: 'sold', image: 'https://picsum.photos/100?3', views: 203, created_at: '2025-01-05' }
            ];
            renderProducts(demoProducts);
            return demoProducts;
        }

        // Render products table
        function renderProducts(products) {
            const activeProducts = products.filter(p => p.status === 'active' || !p.status);
            const soldProducts = products.filter(p => p.status === 'sold');

            // Update badges
            document.getElementById('activeBadge').textContent = activeProducts.length;
            document.getElementById('soldBadge').textContent = soldProducts.length;

            // Render active
            if (activeProducts.length > 0) {
                document.getElementById('activeProducts').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Produkt</th>
                                <th>Preis</th>
                                <th>Status</th>
                                <th>Aufrufe</th>
                                <th>Aktionen</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${activeProducts.map(p => `
                                <tr>
                                    <td>
                                        <div class="product-cell">
                                            <img src="${p.image || p.images?.[0] || 'https://via.placeholder.com/60'}" alt="${p.name}">
                                            <div class="product-info">
                                                <h4>${p.name}</h4>
                                                <p>Erstellt: ${new Date(p.created_at).toLocaleDateString('de-DE')}</p>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="price-cell">${p.price.toFixed(2)}</td>
                                    <td><span class="status-badge active">Aktiv</span></td>
                                    <td>${p.views || 0}</td>
                                    <td>
                                        <button class="action-btn secondary" onclick="editProduct(${p.id})">Bearbeiten</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                document.getElementById('activeProducts').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        <h3>Keine aktiven Anzeigen</h3>
                        <p>Erstelle deine erste Anzeige und beginne mit dem Verkauf!</p>
                        <a href="inserieren.html" class="btn-primary">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"></path>
                            </svg>
                            Anzeige aufgeben
                        </a>
                    </div>
                `;
            }

            // Render sold
            if (soldProducts.length > 0) {
                document.getElementById('soldProducts').innerHTML = `
                    <table>
                        <thead>
                            <tr>
                                <th>Produkt</th>
                                <th>Verkaufspreis</th>
                                <th>Status</th>
                                <th>Verkauft am</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${soldProducts.map(p => `
                                <tr>
                                    <td>
                                        <div class="product-cell">
                                            <img src="${p.image || p.images?.[0] || 'https://via.placeholder.com/60'}" alt="${p.name}">
                                            <div class="product-info">
                                                <h4>${p.name}</h4>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="price-cell">${p.price.toFixed(2)}</td>
                                    <td><span class="status-badge sold">Verkauft</span></td>
                                    <td>${new Date(p.sold_at || p.created_at).toLocaleDateString('de-DE')}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } else {
                document.getElementById('soldProducts').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        <h3>Noch keine Verkaufe</h3>
                        <p>Hier werden deine verkauften Artikel angezeigt.</p>
                    </div>
                `;
            }
        }

        // Load appointments
        async function loadMyAppointments() {
            try {
                const response = await fetch(window.API_BASE_URL + '/api/appointments', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderAppointments(data.appointments || []);
                    return data.appointments || [];
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
            }

            renderAppointments([]);
            return [];
        }

        // Render appointments
        function renderAppointments(appointments) {
            document.getElementById('appointmentsBadge').textContent = appointments.length;

            if (appointments.length > 0) {
                document.getElementById('appointmentsList').innerHTML = appointments.map(apt => `
                    <div class="appointment-card">
                        <div class="appointment-info">
                            <img src="${apt.product_image || 'https://via.placeholder.com/80'}" alt="${apt.product_name}">
                            <div class="appointment-details">
                                <h4>${apt.product_name}</h4>
                                <div class="date-time">
                                    <span>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                            <line x1="16" y1="2" x2="16" y2="6"></line>
                                            <line x1="8" y1="2" x2="8" y2="6"></line>
                                            <line x1="3" y1="10" x2="21" y2="10"></line>
                                        </svg>
                                        ${new Date(apt.date).toLocaleDateString('de-DE')}
                                    </span>
                                    <span>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <circle cx="12" cy="12" r="10"></circle>
                                            <polyline points="12 6 12 12 16 14"></polyline>
                                        </svg>
                                        ${apt.time}
                                    </span>
                                </div>
                                <span class="status-badge ${apt.status === 'confirmed' ? 'active' : 'pending'}">${apt.status === 'confirmed' ? 'Bestatigt' : 'Ausstehend'}</span>
                            </div>
                        </div>
                        <div class="appointment-actions">
                            ${apt.status === 'confirmed' ? `
                                <div class="pin-display">
                                    <span>Bestatigungscode</span>
                                    <strong>${apt.pin || '----'}</strong>
                                </div>
                            ` : `
                                <button class="action-btn primary" onclick="confirmAppointment(${apt.id})">Bestatigen</button>
                                <button class="action-btn secondary" onclick="cancelAppointment(${apt.id})">Absagen</button>
                            `}
                        </div>
                    </div>
                `).join('');
            } else {
                document.getElementById('appointmentsList').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                        <h3>Keine Termine</h3>
                        <p>Hier werden deine Abholtermine angezeigt.</p>
                    </div>
                `;
            }
        }

        // Load offers
        async function loadMyOffers() {
            try {
                const response = await fetch(window.API_BASE_URL + '/api/offers/received', {
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    renderOffers(data.offers || []);
                    return data.offers || [];
                }
            } catch (error) {
                console.error('Error loading offers:', error);
            }

            renderOffers([]);
            return [];
        }

        // Render offers
        function renderOffers(offers) {
            const pendingOffers = offers.filter(o => o.status === 'pending');
            document.getElementById('offersBadge').textContent = pendingOffers.length;

            if (offers.length > 0) {
                document.getElementById('offersList').innerHTML = offers.map(offer => `
                    <div class="appointment-card">
                        <div class="appointment-info">
                            <img src="${offer.product_image || 'https://via.placeholder.com/80'}" alt="${offer.product_name}">
                            <div class="appointment-details">
                                <h4>${offer.product_name}</h4>
                                <p style="margin: 8px 0;">
                                    <strong>Originalpreis:</strong> ${offer.original_price?.toFixed(2) || '-'}
                                    <br>
                                    <strong style="color: #FF8C42;">Angebot:</strong> ${offer.offer_amount?.toFixed(2) || '-'}
                                </p>
                                <span class="status-badge ${offer.status === 'pending' ? 'pending' : offer.status === 'accepted' ? 'active' : 'cancelled'}">
                                    ${offer.status === 'pending' ? 'Ausstehend' : offer.status === 'accepted' ? 'Akzeptiert' : 'Abgelehnt'}
                                </span>
                            </div>
                        </div>
                        ${offer.status === 'pending' ? `
                            <div class="appointment-actions">
                                <button class="action-btn primary" onclick="acceptOffer(${offer.id})">Akzeptieren</button>
                                <button class="action-btn secondary" onclick="declineOffer(${offer.id})">Ablehnen</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } else {
                document.getElementById('offersList').innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h3>Keine Angebote</h3>
                        <p>Hier werden eingehende Preisangebote angezeigt.</p>
                    </div>
                `;
            }
        }

        // Update stats
        function updateStats(products, appointments) {
            const activeProducts = products.filter(p => p.status === 'active' || !p.status);
            const soldProducts = products.filter(p => p.status === 'sold');
            const totalEarnings = soldProducts.reduce((sum, p) => sum + (p.price || 0), 0);

            document.getElementById('activeCount').textContent = activeProducts.length;
            document.getElementById('soldCount').textContent = soldProducts.length;
            document.getElementById('totalEarnings').textContent = totalEarnings.toFixed(2).replace('.', ',') + ' EUR';
        }

        // Accept offer - handshake animation
        async function acceptOffer(offerId) {
            try {
                const response = await fetch(window.API_BASE_URL + `/api/offers/${offerId}/accept`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token'),
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    // Trigger handshake animation
                    if (typeof SuccessAnimations !== 'undefined') {
                        SuccessAnimations.success_fx({ co2Amount: 0.5, message: '+0.5kg CO2 Gespart!' });
                    }
                    // Reload data
                    setTimeout(() => loadSellerData(), 2000);
                }
            } catch (error) {
                console.error('Error accepting offer:', error);
                // Still show animation for demo
                if (typeof SuccessAnimations !== 'undefined') {
                    SuccessAnimations.success_fx({ co2Amount: 0.5, message: '+0.5kg CO2 Gespart!' });
                }
            }
        }

        // Decline offer
        async function declineOffer(offerId) {
            if (!confirm('Mochtest du dieses Angebot wirklich ablehnen?')) return;

            try {
                await fetch(window.API_BASE_URL + `/api/offers/${offerId}/decline`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });
                loadSellerData();
            } catch (error) {
                console.error('Error declining offer:', error);
            }
        }

        // Edit product
        function editProduct(productId) {
            window.location.href = `inserieren.html?edit=${productId}`;
        }

        // Confirm appointment
        async function confirmAppointment(appointmentId) {
            try {
                await fetch(window.API_BASE_URL + `/api/appointments/${appointmentId}/confirm`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });
                loadSellerData();
            } catch (error) {
                console.error('Error confirming appointment:', error);
            }
        }

        // Cancel appointment
        async function cancelAppointment(appointmentId) {
            if (!confirm('Mochtest du diesen Termin wirklich absagen?')) return;

            try {
                await fetch(window.API_BASE_URL + `/api/appointments/${appointmentId}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + localStorage.getItem('auth_token')
                    }
                });
                loadSellerData();
            } catch (error) {
                console.error('Error cancelling appointment:', error);
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            // Inject header and footer
            GlobalHeader.injectHeader('header-container');
            GlobalHeader.injectFooter('footer-container');

            // Load data
            loadSellerData();
        });
    </script>
</body>
</html>
