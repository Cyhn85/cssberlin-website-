<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - CSS Berlin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="auth-magic.css">

    <!-- API Config (Must load before logic) -->
    <script src="api-config.js"></script>
    <script src="api-client.js"></script>
</head>

<body class="magic-auth-body">

    <div class="login-container">
        <canvas id="particles" class="particles-canvas"></canvas>

        <div class="theme-toggle" id="themeToggle" title="Design wechseln">
            <!-- Icons injected by JS -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </div>

        <div class="login-card">
            <div class="login-card-inner">
                <div class="login-header">
                    <h1 id="formTitle">Willkommen</h1>
                    <p>Bitte melden Sie sich an, um fortzufahren</p>
                </div>

                <form class="login-form" id="loginForm">
                    <!-- Register Only Field -->
                    <div class="form-field" id="nameField" style="display:none;">
                        <input type="text" id="nameInput">
                        <label htmlFor="nameInput">Vollständiger Name</label>
                    </div>

                    <div class="form-field">
                        <input type="email" id="email" required>
                        <label htmlFor="email">E-Mail Adresse</label>
                    </div>

                    <div class="form-field">
                        <input type="password" id="password" required>
                        <label htmlFor="password">Passwort</label>
                        <button type="button" class="toggle-password" aria-label="Passwort anzeigen">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span style="margin-right:6px"></span>
                            Angemeldet bleiben
                        </label>

                        <a href="#" class="forgot-password">Passwort vergessen?</a>
                    </div>

                    <button type="submit" class="login-button" id="submitBtn">
                        Anmelden
                    </button>
                </form>

                <div class="separator">
                    <span>oder weiter mit</span>
                </div>

                <div class="social-login">
                    <button class="social-button github" title="Google">
                        <!-- Google Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .533 5.333.533 12S5.867 24 12.48 24c3.44 0 6.013-1.133 8.053-3.24 2.107-2.107 2.773-5.227 2.773-7.813 0-.787-.067-1.48-.187-2.027H12.48z" />
                        </svg>
                    </button>
                    <button class="social-button twitter" title="Apple">
                        <!-- Apple Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.07-.52-2.07-.53-3.2 0-1.44.71-2.63.44-4.04-.96-2.58-2.61-3.6-6.62-1.54-10.27 1.25-2.19 3.32-2.64 5.3-2.13 1.25.32 2.76 1.49 4.26 1.49 1.17 0 3.01-1.38 5.75-.48 1.12.38 2.38 1.33 3.1 2.29-2.77 1.57-3.03 5.92-.16 7.68zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                        </svg>
                    </button>
                    <button class="social-button linkedin" title="Magic Link">
                        <!-- Mail Icon -->
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z">
                            </path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </button>
                </div>

                <p class="signup-prompt" id="switchToRegister">
                    Noch kein Konto? <a href="#">Registrieren</a>
                </p>

                <p style="text-align:center; margin-top:20px;">
                    <a href="index.html" style="font-size:12px; color:#9ca3af; text-decoration:none;">← Zurück zur
                        Startseite</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="auth-magic.js"></script>
</body>

</html>
