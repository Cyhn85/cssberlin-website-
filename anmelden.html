<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anmelden - CSS Berlin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="auth-magic.css">

    <!-- API Config (Must load before logic) -->
    <script src="api-config.js"></script>
    <script src="api-client.js"></script>
</head>

<body class="magic-auth-body">

    <div class="login-container">
        <canvas id="particles" class="particles-canvas"></canvas>

        <div class="theme-toggle" id="themeToggle" title="Design wechseln">
            <!-- Icons injected by JS -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
        </div>

        <div class="login-card">
            <div class="login-card-inner">
                <div class="login-header">
                    <h1 id="formTitle">Willkommen</h1>
                    <p>Bitte melden Sie sich an, um fortzufahren</p>
                </div>

                <form class="login-form" id="loginForm">
                    <!-- Register Only Field -->
                    <div class="form-field" id="nameField" style="display:none;">
                        <input type="text" id="nameInput">
                        <label htmlFor="nameInput">Vollständiger Name</label>
                    </div>

                    <div class="form-field">
                        <input type="email" id="email" required>
                        <label htmlFor="email">E-Mail Adresse</label>
                    </div>

                    <div class="form-field">
                        <input type="password" id="password" required>
                        <label htmlFor="password">Passwort</label>
                        <button type="button" class="toggle-password" aria-label="Passwort anzeigen">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </button>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="rememberMe">
                            <span style="margin-right:6px"></span>
                            Angemeldet bleiben
                        </label>

                        <a href="#" class="forgot-password">Passwort vergessen?</a>
                    </div>

                    <button type="submit" class="login-button" id="submitBtn">
                        Anmelden
                    </button>


                </form>

                <div class="separator">
                    <span>oder weiter mit</span>
                </div>

                <div class="social-login">
                    <!-- Google Button (Clean Standard: White Bg with 'G' colors) -->
                    <button class="social-button full" onclick="window.location.href='/api/auth/google'"
                        title="Mit Google anmelden"
                        style="background: white; border: 1px solid #ddd; color: #555; width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px;">
                        <svg width="20" height="20" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M17.64 9.2c0-.637-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"
                                fill="#4285F4" />
                            <path
                                d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z"
                                fill="#34A853" />
                            <path
                                d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"
                                fill="#FBBC05" />
                            <path
                                d="M9 3.58c1.321 0 2.508.455 3.44 1.346l2.581-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.159 6.656 3.58 9 3.58z"
                                fill="#EA4335" />
                        </svg>
                        <span style="font-weight: 600; font-size: 14px;">Google</span>
                    </button>

                    <!-- Apple Button (Clean Standard: Black Bg with White Icon) -->
                    <button class="social-button full" onclick="window.location.href='/api/auth/apple'"
                        title="Mit Apple anmelden"
                        style="background: black; border: 1px solid black; color: white; width: 100%; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 8px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
                            <path
                                d="M17.05 20.28c-.98.95-2.05.88-3.08.38-1.07-.52-2.07-.53-3.2 0-1.44.71-2.63.44-4.04-.96-2.58-2.61-3.6-6.62-1.54-10.27 1.25-2.19 3.32-2.64 5.3-2.13 1.25.32 2.76 1.49 4.26 1.49 1.17 0 3.01-1.38 5.75-.48 1.12.38 2.38 1.33 3.1 2.29-2.77 1.57-3.03 5.92-.16 7.68zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z" />
                        </svg>
                        <span style="font-weight: 600; font-size: 14px;">Apple</span>
                    </button>
                </div>

                <!-- Magic Link Trigger -->
                <button type="button" class="magic-link-trigger" id="magicLinkTrigger">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                        <path d="M22 6l-10 7L2 6"></path>
                    </svg>
                    Mit Magic Link anmelden
                </button>

                <!-- Hidden Magic Link Input (Smart Design) -->
                <div id="magicLinkArea" style="display: none;">
                    <p>
                        Wir senden Ihnen einen Link zum Anmelden.
                    </p>
                    <div style="display: flex; gap: 8px;">
                        <input type="email" id="magicEmail" placeholder="ihre@email.de">
                        <button id="sendMagicLink">
                            Senden
                        </button>
                    </div>
                </div>

                <script>
                    document.getElementById('magicLinkTrigger').addEventListener('click', function () {
                        const area = document.getElementById('magicLinkArea');
                        const isHidden = area.style.display === 'none';
                        area.style.display = isHidden ? 'block' : 'none';
                        // Populate email if present in main form
                        if (isHidden) {
                            const mainEmail = document.getElementById('email').value;
                            if (mainEmail) document.getElementById('magicEmail').value = mainEmail;
                        }
                    });
                </script>

                <p class="signup-prompt" id="switchToRegister">
                    Noch kein Konto? <a href="#">Registrieren</a>
                </p>

                <p style="text-align:center; margin-top:20px;">
                    <a href="index.html" style="font-size:12px; color:#9ca3af; text-decoration:none;">← Zurück zur
                        Startseite</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Logic -->
    <script src="auth-magic.js"></script>
</body>

</html>
