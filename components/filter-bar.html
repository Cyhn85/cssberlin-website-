<style>
    /* Filter Bar Container */
    .filter-bar-container {
        background: white;
        border-bottom: 1px solid #e5e7eb;
        padding: 15px 0;
        position: sticky;
        top: 70px;
        /* Below fixed header */
        z-index: 90;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .filter-bar-inner {
        max-width: 1400px;
        margin: 0 auto;
        padding: 0 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }

    /* Filter Buttons/Dropdowns */
    .filter-dropdown {
        position: relative;
        display: inline-block;
    }

    .filter-btn {
        background: white;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: #374151;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: all 0.2s;
    }

    .filter-btn:hover {
        border-color: #9ca3af;
        background: #f9fafb;
    }

    .filter-btn.active {
        background: #f0fdf4;
        /* Light Green */
        border-color: #2D5016;
        color: #2D5016;
    }

    /* Dropdown Content */
    .filter-content {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        margin-top: 8px;
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        min-width: 240px;
        z-index: 100;
        padding: 16px;
        animation: fadeIn 0.15s ease-out;
    }

    .filter-content.show {
        display: block;
    }

    /* Checkbox Style */
    .filter-option {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 0;
        cursor: pointer;
    }

    .filter-option input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #2D5016;
    }

    /* Clear Filters */
    .clear-filters {
        margin-left: auto;
        font-size: 13px;
        color: #6b7280;
        text-decoration: underline;
        cursor: pointer;
        border: none;
        background: none;
        display: none;
    }

    .clear-filters:hover {
        color: #111;
    }
</style>

<div class="filter-bar-container">
    <div class="filter-bar-inner">
        <!-- Category Filter -->
        <div class="filter-dropdown">
            <button class="filter-btn" onclick="toggleFilter('category')">
                Kategorie <span id="cat-count"></span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="filter-content" id="filter-category">
                <label class="filter-option"><input type="checkbox" value="Damen" onchange="applyFilters()">
                    Damen</label>
                <label class="filter-option"><input type="checkbox" value="Herren" onchange="applyFilters()">
                    Herren</label>
                <label class="filter-option"><input type="checkbox" value="Kinder" onchange="applyFilters()">
                    Kinder</label>
                <label class="filter-option"><input type="checkbox" value="Elektronik" onchange="applyFilters()">
                    Elektronik</label>
            </div>
        </div>

        <!-- Size Filter -->
        <div class="filter-dropdown">
            <button class="filter-btn" onclick="toggleFilter('size')">
                Größe
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="filter-content" id="filter-size"
                style="width:300px; display:none; grid-template-columns: 1fr 1fr;">
                <label class="filter-option"><input type="checkbox" value="XS" onchange="applyFilters()"> XS</label>
                <label class="filter-option"><input type="checkbox" value="S" onchange="applyFilters()"> S</label>
                <label class="filter-option"><input type="checkbox" value="M" onchange="applyFilters()"> M</label>
                <label class="filter-option"><input type="checkbox" value="L" onchange="applyFilters()"> L</label>
                <label class="filter-option"><input type="checkbox" value="XL" onchange="applyFilters()"> XL</label>
                <label class="filter-option"><input type="checkbox" value="XXL" onchange="applyFilters()"> XXL</label>
            </div>
        </div>

        <!-- Price Filter -->
        <div class="filter-dropdown">
            <button class="filter-btn" onclick="toggleFilter('price')">
                Preis
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="filter-content" id="filter-price">
                <div style="display:flex; gap:10px; align-items:center;">
                    <input type="number" placeholder="Min €" id="price-min"
                        style="width:80px; padding:8px; border:1px solid #ddd; border-radius:6px;">
                    <span>-</span>
                    <input type="number" placeholder="Max €" id="price-max"
                        style="width:80px; padding:8px; border:1px solid #ddd; border-radius:6px;">
                </div>
                <button onclick="applyFilters()"
                    style="width:100%; margin-top:10px; background:#2D5016; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer;">Anwenden</button>
            </div>
        </div>

        <!-- Condition Filter -->
        <div class="filter-dropdown">
            <button class="filter-btn" onclick="toggleFilter('condition')">
                Zustand
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
            <div class="filter-content" id="filter-condition">
                <label class="filter-option"><input type="checkbox" value="Neu" onchange="applyFilters()"> Neu /
                    Neuwertig</label>
                <label class="filter-option"><input type="checkbox" value="Sehr gut" onchange="applyFilters()"> Sehr
                    gut</label>
                <label class="filter-option"><input type="checkbox" value="Gut" onchange="applyFilters()"> Gut</label>
            </div>
        </div>

        <button class="clear-filters" id="clear-filters-btn" onclick="clearFilters()">Filter zurücksetzen</button>
    </div>
</div>

<script>
    function toggleFilter(id) {
        // Close others
        document.querySelectorAll('.filter-content').forEach(el => {
            if (el.id !== 'filter-' + id) el.style.display = 'none';
        });

        const el = document.getElementById('filter-' + id);
        if (el) {
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
            if (id === 'size') el.style.display = el.style.display === 'block' ? 'grid' : 'none'; // Grid for size
        }
    }

    // Close when clicking outside
    document.addEventListener('click', function (e) {
        if (!e.target.closest('.filter-dropdown')) {
            document.querySelectorAll('.filter-content').forEach(el => el.style.display = 'none');
        }
    });

    async function applyFilters() {
        const categories = Array.from(document.querySelectorAll('#filter-category input:checked')).map(cb => cb.value);
        const sizes = Array.from(document.querySelectorAll('#filter-size input:checked')).map(cb => cb.value);
        const conditions = Array.from(document.querySelectorAll('#filter-condition input:checked')).map(cb => cb.value);
        const minPrice = document.getElementById('price-min').value;
        const maxPrice = document.getElementById('price-max').value;

        // Show/Hide Clear Button
        const hasFilters = categories.length > 0 || sizes.length > 0 || conditions.length > 0 || minPrice || maxPrice;
        document.getElementById('clear-filters-btn').style.display = hasFilters ? 'block' : 'none';

        // CLIENT-SIDE FILTERING (Since API might not support all complex queries yet)
        if (window.loadedProducts) {
            const productsGrid = document.getElementById('productsGrid');
            if (!productsGrid) return;

            // Restore all if needed (we need a master list, assume loadedProducts is it)
            let filtered = window.loadedProducts;

            if (categories.length > 0) {
                filtered = filtered.filter(p => categories.some(c => p.category === c || (p.brand && p.brand.includes(c)) /* fallback logic */));
                // Note: 'brand' isn't category. We might need better data mapping. 
                // For now, let's filter by checking if name or brand contains text relevant to category? 
                // Or better: The API call should have handled the main category. 
                // If we are on Home, we have mixed. 
            }

            if (sizes.length > 0) {
                filtered = filtered.filter(p => sizes.includes(p.size));
            }

            if (conditions.length > 0) {
                filtered = filtered.filter(p => conditions.some(c => p.condition.includes(c)));
            }

            if (minPrice) filtered = filtered.filter(p => p.price >= minPrice);
            if (maxPrice) filtered = filtered.filter(p => p.price <= maxPrice);

            // Re-render
            productsGrid.innerHTML = '';
            if (filtered.length === 0) {
                productsGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding:40px;">Keine Produkte gefunden.</div>';
            } else {
                filtered.forEach(product => {
                    // createProductCard must be globally available
                    if (window.createProductCard) {
                        productsGrid.innerHTML += window.createProductCard(product);
                    }
                });
                if (window.attachProductEventListeners) window.attachProductEventListeners();
                if (window.updateCartButtonStates) window.updateCartButtonStates();
            }
        }
    }

    function clearFilters() {
        document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        document.getElementById('price-min').value = '';
        document.getElementById('price-max').value = '';
        applyFilters();
    }
</script>
