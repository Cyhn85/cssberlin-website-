<!DOCTYPE html>
<html lang="de">
<head>
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damen - CSS Berlin</title>
    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="header-v3.css">
    <link rel="stylesheet" href="auth-modal-v3.css">
    <link rel="stylesheet" href="cookie-consent.css">
    <link rel="stylesheet" href="footer-v3.css">
    <link rel="stylesheet" href="gradient-button.css">
    
    <!-- CLERK AUTH -->
    <script async crossorigin="anonymous"
      data-clerk-publishable-key="pk_test_c3VwZXItd2FzcC04NS5jbGVyay5hY2NvdW50cy5kZXYk"
      src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@latest/dist/clerk.browser.js"
      type="text/javascript"></script>
    
    <script src="api-config.js"></script>
    <script src="auth-modal-v3.js"></script>

</head>
<body>
    <!-- Header -->
    
    
    <div id="header-placeholder"></div>



    <!-- Category Header -->
    <div style="background: linear-gradient(135deg, #2D5016, #4A7C2C); color: white; padding: 48px 0;">
        <div style="max-width: 1400px; margin: 0 auto; padding: 0 32px;">
            <h1 style="font-size: 48px; font-weight: 700; margin-bottom: 16px;">Damen</h1>
            <p style="font-size: 18px; opacity: 0.9;">Entdecke nachhaltige Mode für Frauen</p>
        </div>
    </div>

    <!-- Products Section -->
    <section class="products-section">
        <div class="section-header">
            <h2>Alle Damen Produkte</h2>
            <div class="filter-controls">
                <select class="sort-dropdown">
                    <option>Sortieren</option>
                    <option>Preis aufsteigend</option>
                    <option>Preis absteigend</option>
                    <option>Neu zuerst</option>
                    <option>Meiste CO₂ Einsparung</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be generated by JavaScript -->
        </div>

        <div class="load-more-container">
            <button class="load-more-btn" id="loadMoreBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
                Mehr Produkte laden
            </button>
        </div>
    </section>

    <!-- Footer -->
    
    
    <div id="footer-placeholder"></div>



    <script src="script.js"></script>
<script src="smart-header.js"></script>
    <script src="components.js"></script>
    <script src="toast.js"></script>
    <script src="message-modal.js"></script>
</body>
</html>
